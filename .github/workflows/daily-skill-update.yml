name: Daily Claude Code Skills Update

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: claude-skills-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout claude/zealous-sagan-qUMtm
        uses: actions/checkout@v4
        with:
          ref: claude/zealous-sagan-qUMtm
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Sync Claude Code skills from anthropics/claude-code
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python Claude/scripts/sync_claude_skills.py

      - name: Block unexpected non-Claude changes
        run: |
          unexpected="$(git status --porcelain | awk '{print $2}' | grep -Ev '^Claude/' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected changes outside Claude/:"
            echo "$unexpected"
            exit 1
          fi

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Claude/
          if git diff --cached --quiet; then
            echo "No changes - already up to date"
          else
            DATE=$(TZ=Asia/Seoul date +%Y-%m-%d)
            git commit -m "chore: Claude Code skills update ${DATE}"
            git push -u origin claude/zealous-sagan-qUMtm
          fi
