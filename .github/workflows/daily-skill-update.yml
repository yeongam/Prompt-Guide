name: Daily Claude Code Skills Update

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: claude-skills-update
  cancel-in-progress: false

jobs:
  update-skills:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run CLI changelog update script
        run: python scripts/update_skills.py

      - name: Sync dated Claude skill/hook snapshots from official Anthropic repos
        run: python Claude/scripts/sync_claude_skills.py

      - name: Block unexpected non-Claude changes
        run: |
          unexpected="$(git status --porcelain | awk '{print $2}' | grep -Ev '^Claude/' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected changes outside Claude/:"
            echo "$unexpected"
            exit 1
          fi

      - name: Commit and push to main if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add Claude

          if git diff --cached --quiet; then
            echo "No Claude skill or hook changes."
            exit 0
          fi

          DATE=$(date -u +%Y-%m-%d)
          git commit -m "chore: Claude Code skills update ${DATE}"
          git pull --rebase origin main
          git push origin HEAD:main
