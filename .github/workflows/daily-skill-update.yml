name: Daily Claude Code Skills Update

on:
  schedule:
    - cron: "0 0 * * *"   # 00:00 UTC daily (09:00 KST)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: claude-skills-update
  cancel-in-progress: false

jobs:
  update-skills:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: claude/zealous-sagan-jWjUg
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Sync Claude Code skills
        run: python scripts/update_skills.py

      - name: Block unexpected changes outside Claude/
        run: |
          unexpected="$(git status --porcelain | awk '{print $2}' | grep -Ev '^Claude/' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected changes outside Claude/:"
            echo "$unexpected"
            exit 1
          fi

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add Claude/

          if git diff --cached --quiet; then
            echo "No changes - already up to date."
            exit 0
          fi

          DATE=$(TZ=Asia/Seoul date +%Y-%m-%d)
          git commit -m "chore: Claude Code skills update ${DATE}"
          git pull --rebase origin claude/zealous-sagan-jWjUg
          git push -u origin claude/zealous-sagan-jWjUg
