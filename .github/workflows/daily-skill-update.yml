name: Daily Claude Code Skills Update

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-claude-skills-update
  cancel-in-progress: false

jobs:
  update-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/zealous-sagan-Uuu89
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run skill update script
        run: python scripts/update_skills.py

      - name: Block unexpected non-Claude changes
        run: |
          unexpected="$(git status --porcelain | awk '{print $2}' | grep -Ev '^(Claude/|scripts/)' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected changes outside Claude/ or scripts/:"
            echo "$unexpected"
            exit 1
          fi

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Claude/ scripts/

          if git diff --cached --quiet; then
            echo "No changes - already up to date"
          else
            DATE=$(date -u +%Y-%m-%d)
            git commit -m "chore: Claude Code skills update ${DATE}"
            git push -u origin claude/zealous-sagan-Uuu89
          fi
