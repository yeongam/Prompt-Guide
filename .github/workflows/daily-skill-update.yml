name: Daily Claude Code Skills Update

on:
  schedule:
    # 00:00 KST = 15:00 UTC
    - cron: "0 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: claude-skills-update
  cancel-in-progress: false

jobs:
  update-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/zealous-sagan-ucva06
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run skill update script
        run: python scripts/update_skills.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes – already up to date"
          else
            DATE=$(TZ=Asia/Seoul date +%Y-%m-%d)
            git commit -m "chore: Claude Code skills update ${DATE}"
            git push -u origin claude/zealous-sagan-ucva06
          fi
