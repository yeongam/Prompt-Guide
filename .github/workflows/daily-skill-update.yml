name: Daily Claude Code Skills Update

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: claude-skills-update
  cancel-in-progress: false

jobs:
  update-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/zealous-sagan-cVCMw
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Sync Claude Code skills and changelogs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python Claude/scripts/sync_claude_skills.py

      - name: Block unexpected non-Claude changes
        run: |
          unexpected="$(git status --porcelain | awk '{print $2}' | grep -Ev '^Claude/' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected changes outside Claude/:"
            echo "$unexpected"
            exit 1
          fi

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add Claude

          if git diff --cached --quiet; then
            echo "No Claude skill changes."
            exit 0
          fi

          DATE="$(TZ=Asia/Seoul date +%Y-%m-%d)"
          git commit -m "chore: sync Claude Code skills and hooks ${DATE}"
          git pull --rebase origin claude/zealous-sagan-cVCMw
          git push -u origin claude/zealous-sagan-cVCMw
