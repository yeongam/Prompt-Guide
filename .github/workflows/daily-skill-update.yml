name: Daily Claude Code Skills Update

on:
  schedule:
    # 00:00 KST = 15:00 UTC (previous day)
    - cron: "0 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: claude-skills-sync
  cancel-in-progress: false

jobs:
  update-skills:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: claude/zealous-sagan-sc8bj
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Claude skills sync
        run: python scripts/update_skills.py

      - name: Block unexpected non-Claude changes
        run: |
          unexpected="$(git status --porcelain | awk '{print $2}' | grep -Ev '^Claude/' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected changes outside Claude/:"
            echo "$unexpected"
            exit 1
          fi

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add Claude/

          if git diff --cached --quiet; then
            echo "No changes — already up to date."
            exit 0
          fi

          DATE="$(TZ=Asia/Seoul date +%Y-%m-%d)"
          git commit -m "chore: sync Claude Code skills ${DATE}"
          git pull --rebase origin claude/zealous-sagan-sc8bj
          git push -u origin claude/zealous-sagan-sc8bj
