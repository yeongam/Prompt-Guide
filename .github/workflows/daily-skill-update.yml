name: Daily Claude Code Skills Update

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: claude-skill-sync
  cancel-in-progress: false

jobs:
  update-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run legacy skill update script (SKILLS_CATALOG.yaml version/date, root changelogs/)
        run: python scripts/update_skills.py

      - name: Run dated Claude skill snapshot + Claude/Changelogs
        run: python Claude/scripts/sync_claude_skills.py

      - name: Block unexpected changes outside Claude/ and changelogs/
        run: |
          unexpected="$(git status --porcelain | awk '{print $2}' | grep -Ev '^(Claude/|changelogs/)' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected changes outside Claude/ and changelogs/:"
            echo "$unexpected"
            exit 1
          fi

      - name: Commit and push to main if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes - already up to date"
          else
            DATE=$(date -u +%Y-%m-%d)
            git commit -m "chore: Claude Code skills update ${DATE}"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
