name: Daily Claude Code Skills Update

on:
  schedule:
    - cron: "0 15 * * *"  # 00:00 KST (UTC+9) = 15:00 UTC previous day
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run skill sync script
        run: python scripts/update_skills.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes - already up to date"
          else
            DATE=$(TZ=Asia/Seoul date +%Y-%m-%d)
            git commit -m "chore: Claude Code skills sync ${DATE}"
            git push -u origin main
          fi
