name: GPT OpenAI Skills Sync

on:
  schedule:
    # 00:00 KST = 15:00 UTC on the previous day.
    - cron: "0 15 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: gpt-openai-skills-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Sync GPT skills from official OpenAI repositories
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python GPT/scripts/sync_openai_skills.py

      - name: Block unexpected non-GPT changes
        run: |
          unexpected="$(git status --porcelain | awk '{print $2}' | grep -Ev '^GPT/' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected changes outside GPT/:"
            echo "$unexpected"
            exit 1
          fi

      - name: Commit, push, and open PR if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add GPT

          if git diff --cached --quiet; then
            echo "No GPT skill changes."
            exit 0
          fi

          git checkout -B automation/gpt-openai-skills-sync
          git fetch origin automation/gpt-openai-skills-sync:refs/remotes/origin/automation/gpt-openai-skills-sync || true
          DATE="$(TZ=Asia/Seoul date +%Y-%m-%d)"
          git commit -m "chore: sync GPT OpenAI skills ${DATE}"
          git push --force-with-lease origin HEAD:automation/gpt-openai-skills-sync

          PR_NUMBER="$(gh pr list \
            --base main \
            --head yeongam:automation/gpt-openai-skills-sync \
            --state open \
            --json number \
            --jq '.[0].number // empty')"

          PR_BODY="Automated GPT skill sync.

          - Runs daily at 00:00 KST.
          - Uses official OpenAI GitHub repositories as source material.
          - Writes skills under \`GPT/skills/YYYY-MM-DD/skills/\`.
          - Writes changelogs under \`GPT/Changelogs/\`.
          - Blocks changes outside \`GPT/\` during routine execution.
          - Opens or updates this PR instead of pushing directly to \`main\`."

          if [ -n "$PR_NUMBER" ]; then
            gh pr edit "$PR_NUMBER" \
              --title "chore: sync GPT OpenAI skills" \
              --body "$PR_BODY"
            echo "Updated PR #$PR_NUMBER"
          else
            gh pr create \
              --base main \
              --head automation/gpt-openai-skills-sync \
              --title "chore: sync GPT OpenAI skills" \
              --body "$PR_BODY"
          fi
