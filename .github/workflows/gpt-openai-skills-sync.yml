name: GPT OpenAI Skills and Hooks Sync

on:
  schedule:
    # 00:00 KST = 15:00 UTC on the previous day.
    - cron: "0 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gpt-openai-skills-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Sync GPT skills and hooks from official OpenAI repositories
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python GPT/scripts/sync_openai_skills.py

      - name: Block unexpected non-GPT changes
        run: |
          unexpected="$(git status --porcelain | awk '{print $2}' | grep -Ev '^GPT/' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected changes outside GPT/:"
            echo "$unexpected"
            exit 1
          fi

      - name: Commit and push to main if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add GPT

          if git diff --cached --quiet; then
            echo "No GPT skill or hook changes."
            exit 0
          fi

          DATE="$(TZ=Asia/Seoul date +%Y-%m-%d)"
          git commit -m "chore: sync GPT OpenAI skills and hooks ${DATE}"
          git pull --rebase origin main
          git push origin HEAD:main
