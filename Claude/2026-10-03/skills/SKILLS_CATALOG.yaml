# Claude Code Skills Catalog | src: anthropics/claude-code | daily sync
# Compact: 1 line/skill; fmt = cmd | trigger | desc
version: 2.1.288
updated: 2026-10-03
skills:
  init: {cmd: /init, when: init/document codebase, desc: generate CLAUDE.md}
  code-review: {cmd: "/code-review [low|medium|high|xhigh|max|ultra] [pr#] [--comment] [--fix]", when: review diff/PR for bugs, desc: "effort-leveled review; --comment=inline PR comments; ultra=cloud multi-agent aliases /review (fast single-pass for PR), legacy /simplify name"}
  simplify: {cmd: /simplify, when: clean up changed code, desc: reuse/efficiency cleanups then fix (kept; upstream renamed to code-review, bundled skill still present)}
  security-review: {cmd: /security-review, when: security audit of branch, desc: OWASP-focused risk-ranked findings}
  ultrareview: {cmd: "/ultrareview [PR#] [--post]", when: multi-agent cloud review, desc: billed; local branch or PR; git>=2.31 for upload; --post posts PR comment directly}
  ultraplan: {cmd: /ultraplan, when: cloud multi-agent planning, desc: auto cloud worktrees/envs}
  goal: {cmd: /goal <condition>, when: keep working until done, desc: multi-turn until condition met; works interactive/-p/RC; live overlay}
  loop: {cmd: "/loop [interval] [prompt]", when: recurring task, desc: interval or self-paced dynamic; /usage shows per-loop token breakdown}
  dataviz: {cmd: /dataviz, when: any chart/dashboard, desc: chart design guidance + palette validator}
  skill-doctor: {cmd: /skill-doctor, when: prune skills, desc: shows unused skills and context cost}
  reload-skills: {cmd: /reload-skills, when: skills changed on disk, desc: rescan skill dirs, no restart}
  reload-plugins: {cmd: /reload-plugins, when: plugin changes, desc: reload plugins (also headless/SDK)}
  session-start-hook: {cmd: /session-start-hook, when: tests/linters on web session start, desc: create SessionStart hook}
  update-config: {cmd: /update-config, when: hooks/permissions/env via settings.json, desc: configure harness}
  keybindings-help: {cmd: /keybindings-help, when: remap keys, desc: edit ~/.claude/keybindings.json; effortSlider:* actions}
  fewer-permission-prompts: {cmd: /fewer-permission-prompts, when: reduce prompts, desc: add read-only allowlist to .claude/settings.json}
  claude-api: {cmd: /claude-api, when: Anthropic SDK/API work, desc: API apps, caching, tool use, migration}
  team-onboarding: {cmd: /team-onboarding, when: teammate ramp-up, desc: guide from local usage}
  powerup: {cmd: /powerup, when: learn features, desc: interactive demos}
  plan: {cmd: "/plan [prompt]", when: plan mode, desc: switch to plan mode / first planning prompt / show plan}
  cd: {cmd: /cd <dir>, when: change working dir, desc: move session keeping prompt cache}
  effort: {cmd: /effort, when: set effort, desc: slider Faster/Smarter; s=session-only; CLAUDE_EFFORT}
  usage: {cmd: /usage, when: tokens/cost, desc: usage, spend limit, attribution per skill/agent/plugin/MCP, Loops}
  usage-credits: {cmd: /usage-credits, when: request more usage, desc: renamed from /extra-usage (old works)}
  focus: {cmd: /focus, when: compact view, desc: prompt + summary + response only}
  tui: {cmd: /tui, when: flicker, desc: alt-screen render (CLAUDE_CODE_NO_FLICKER)}
  undo: {cmd: /undo, when: undo, desc: alias /rewind (can resume pre-/clear)}
  btw: {cmd: /btw, when: side question, desc: side panel; Shift+arrows history; c=copy}
  copy: {cmd: /copy, when: copy response, desc: copy last response}
  diff: {cmd: /diff, when: view changes, desc: toggle diff panel (fullscreen)}
  theme: {cmd: "/theme [name]", when: theme, desc: switch/create theme}
  color: {cmd: /color, when: session color, desc: random color}
  scroll-speed: {cmd: /scroll-speed, when: wheel speed, desc: tune with preview}
  advisor: {cmd: "/advisor [model|off]", when: advisor model, desc: text form for headless/desktop}
  status: {cmd: /status, when: session info, desc: version/account/model/org policy/GitHub link}
  doctor: {cmd: /doctor, when: config issues, desc: diagnostics incl. CLAUDE.md trim, sandbox masks}
  removed: {cmds: "/agents wizard (edit .claude/agents/ or ask Claude), /extra-usage→usage-credits, /cost merged into /usage"}
hooks:  # block: exit 2 | {decision:block}; PermissionDenied retry: {retry:true}
  PreToolUse: {block: y}
  PostToolUse: {}
  Notification: {}
  Stop: {}
  SubagentStart: {}
  SubagentStop: {}
  PreCompact: {block: y}
  TaskCreated: {}
  WorktreeCreate: {http: hookSpecificOutput.worktreePath}
  PermissionDenied: {retry: y}
  DirectoryAdded: {fires: after /add-dir}
  PreModelSwitch: {block: y}
  PostModelSwitch: {}
  MessageDisplay: {fires: transform/hide assistant text}
  types: [shell, mcp_tool, http]
settings:
  skillOverrides: "off|user-invocable-only|name-only"
  disableSkillShellExecution: bool
  showThinkingSummaries: bool
  autoScrollEnabled: bool
  prUrlTemplate: string
  modelPicker: ordered labeled model list
  modelPricing: managed; contracted rates
  workflowSizeGuideline: small|medium|large (advisory)
  feedbackDrafts: bool
  sandbox.network.deniedDomains: list
env:
  CLAUDE_EFFORT: effort level
  CLAUDE_CODE_NO_FLICKER: 1=alt-screen
  CLAUDE_CODE_DISABLE_BUNDLED_SKILLS: 1=hide bundled skills/commands
  CLAUDE_CODE_SAFE_MODE: start without customizations
  CLAUDE_CODE_MAX_SUBAGENTS_PER_SESSION: default 200
  CLAUDE_CODE_MAX_CONCURRENT_SUBAGENTS: cap parallel agents
  CLAUDE_CODE_MAX_WEB_SEARCHES_PER_SESSION: search cap
  CLAUDE_CODE_MAX_MCP_DESCRIPTION_LENGTH: default 2048
  CLAUDE_CODE_DISABLE_WEB_FETCH: 1=off
  CLAUDE_CODE_DISABLE_MOUSE_CLICKS: 1=wheel only
  ANTHROPIC_DEFAULT_MODEL: start model (/model overrides)
  CLAUDE_CODE_USE_POWERSHELL_TOOL: 1=on
  CLAUDE_STREAM_IDLE_TIMEOUT_MS: ms
  CLAUDE_CODE_ENABLE_GATEWAY_MODEL_DISCOVERY: 1=on
  DISABLE_UPDATES: 1=block updates
  OTEL_LOG_RAW_API_BODIES: 1=raw bodies
models: {default: claude-sonnet-5-5, opus: claude-opus-5-5, fable: claude-fable-5-1, haiku: claude-haiku-4-5-20251001}
