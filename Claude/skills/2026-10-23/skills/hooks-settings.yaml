# Hooks/settings/env, v2.1.309. Block: exit 2 | {decision:block}. Types: shell|mcp_tool|http; args:[] = exec w/o shell
hooks:
  PreToolUse: "before tool; can block"
  PostToolUse: "after tool; continueOnBlock:true feeds rejection back"
  PreCompact: "before compaction; can block"
  PermissionDenied: "auto-mode denial; {retry:true}"
  Notification: "push events; agent_needs_input|agent_completed"
  Stop: "turn end"
  SubagentStop: "subagent end"
  TaskCreated: "TaskCreate"
  WorktreeCreate: "http returns worktreePath"
  MessageDisplay: "transform/hide assistant text"
  DirectoryAdded: "after /add-dir"
  PreModelSwitch: "block/confirm/annotate switch"
  PostModelSwitch: "after switch"
  opt: "onFailure:block (fail closed); terminalSequence (bell/title)"
settings:
  skillOverrides: "off|user-invocable-only|name-only"
  disableBundledSkills: "hide bundled skills (env CLAUDE_CODE_DISABLE_BUNDLED_SKILLS)"
  disableSkillShellExecution: bool
  syncClaudeAiSkills/syncClaudeAiPlugins: "false opts out of claude.ai sync"
  fallbackModel: "<=3 fallbacks"
  maxEffortLevel: "cap effort"
  modelPicker: "curate /model list"
  promptCacheTtl/subagentPromptCacheTtl: "1h main, 5m subagents"
  bashOutputMaxChars/taskOutputMaxChars: "<=128K inline"
  idleCompaction: "false disables"
  worktree.baseRef: "fresh|head"
  attribution.sessionUrl: "omit session link"
  autoMode.classifyAllShell: bool
  sandbox: "network.deniedDomains, network.strictAllowlist, filesystem.disabled, credentials"
  workflowSizeGuideline: "small|medium|large"
  ui: "timeFormat timeZone maxProseWidth keybindingFlavor spellcheck emojiCompletionEnabled vimInsertModeRemaps axScreenReader"
env:
  CLAUDE_EFFORT: "effort in skill templates"
  CLAUDE_CODE_SESSION_ID: "in Bash env"
  ANTHROPIC_DEFAULT_MODEL: "start model; /model overrides"
  CLAUDE_CODE_SAFE_MODE: "disable all customizations (--safe-mode)"
  CLAUDE_CODE_SUBAGENT_MODEL_FORCE: "force subagent model"
  CLAUDE_CODE_WORKFLOW_SUBAGENT_MODEL: "workflow agent model"
  CLAUDE_CODE_WORKFLOW_MAX_CONCURRENT_AGENTS: "1-256"
  CLAUDE_CODE_MAX_CONCURRENT_SUBAGENTS: "20"
  CLAUDE_CODE_MAX_SUBAGENTS_PER_SESSION: "200"
  CLAUDE_CODE_MAX_WEB_SEARCHES_PER_SESSION: "200"
  CLAUDE_CODE_DISABLE_WEB_FETCH: "1"
  CLAUDE_CODE_DISABLE_FILE_MENTIONS: "@ gives paths only"
  CLAUDE_CODE_IDLE_COMPACT_MIN_TOKENS: "200K"
  CLAUDE_CODE_RETRY_WATCHDOG: "unattended retry (+_MAX_WAIT_MS)"
  CLAUDE_CODE_AUTO_MODE_MODEL: "classifier model"
  CLAUDE_CODE_RESTRICTED: "1 = --restricted"
  CLAUDE_CODE_NO_FLICKER: "1 = /tui"
models: {opus: claude-opus-5-5, sonnet: claude-sonnet-5-5, haiku: claude-haiku-5-5, fable: claude-fable-5-1}
