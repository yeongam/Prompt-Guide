# Claude Code skills/commands. Src: anthropics/claude-code CHANGELOG. v2.1.309 @2026-10-23
# fmt: name: "cmd | use when | effect"
v: 2.1.309
code:
  init: "/init | document codebase | write CLAUDE.md (reads AGENTS.md if no CLAUDE.md)"
  code-review: "/code-review [lvl] [PR] [--comment|--fix|--max-findings n|all] | review diff/PR | bugs+cleanups; replaces /review"
  security-review: "/security-review | audit branch | risk-ranked findings"
  simplify: "/simplify | clean changed code | reuse/efficiency fixes, no bug hunt"
  verify: "/verify | confirm change works | run app/tests"
  run: "/run | launch app | drive app to see change"
  claude-api: "/claude-api [upgrade|prompt-audit] | Anthropic SDK code | caching, tools, tracing, model migration (Opus 4.8)"
  dataviz: "/dataviz | chart/dashboard | design guide + palette validator"
  goal: "/goal <cond> | work until done | loops across turns until met"
  loop: "/loop [interval] [cmd] | recurring task | interval or self-paced"
  ultrareview: "/ultrareview [PR#] | deep review | multi-agent cloud, billed"
  ultraplan: "/ultraplan | complex plan | cloud multi-agent planning"
  workflows: "/workflows | multi-agent runs | list/inspect Workflow runs"
  cd: "/cd <dir> | change cwd | keeps prompt cache"
  diff: "/diff | see uncommitted edits | side panel (fullscreen)"
  rewind: "/rewind (=/undo) | undo | restore code/conversation"
docs:
  doctor: "/doctor [prompt-audit] | audit CLAUDE.md/skills/agents | trims derivable content, flags old-model prompts"
  skill-doctor: "/skill-doctor | prune skills | unused skills + context cost"
  team-onboarding: "/team-onboarding | ramp-up guide | from usage history"
config:
  update-config: "/update-config | hooks/perms/env | edit settings.json"
  keybindings-help: "/keybindings-help | rebind keys | keybindings.json"
  fewer-permission-prompts: "/fewer-permission-prompts | cut prompts | allowlist in settings"
  auto-mode-setup: "/auto-mode-setup | tune auto mode | guided from project+sessions"
  reload-skills: "/reload-skills | after skill edits | rescan, no restart"
  reload-plugins: "/reload-plugins | after plugin edits | reload"
  session-start-hook: "/session-start-hook | cloud test/lint | SessionStart hook"
ui:
  effort: "/effort | quality level | slider; s=session only"
  advisor: "/advisor [model|off] | second-model advice"
  usage: "/usage | tokens/cost | loops, cache, spend"
  focus: "/focus | compact view | prompt+summary+reply"
  tui: "/tui | no flicker | alt-screen"
  powerup: "/powerup | learn features | demos"
  misc: "/theme /color /btw /scroll-speed /copy"
