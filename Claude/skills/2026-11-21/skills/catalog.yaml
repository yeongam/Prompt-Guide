# Claude Code skills catalog (compact). Source: anthropics/claude-code CHANGELOG
version: 2.1.330
prev: 2.1.129
updated: 2026-11-21
# Format → name: "cmd | when | what". Details live in <name>.md only when it is a usable skill.
skills:  # usable skill files in this dir
  code-review: "/code-review [low..max] [target] [--comment|--fix] | find bugs in diff/PR | correctness review"
  simplify: "/simplify | clean up changed code | reuse/simplify/efficiency fixes, no bug hunt"
  claude-api: "/claude-api [sub] | Anthropic SDK code or LLM question | build/debug/migrate/optimize"
  docs-maintenance: "/init, /doctor prompt-audit | CLAUDE.md/AGENTS.md/skill docs | create, trim, audit"
  dataviz: "/dataviz | any chart/dashboard | palette + mark rules"
commands:  # built-ins; one line each
  init: "/init | new repo | generate CLAUDE.md"
  security-review: "/security-review | audit branch diff | risk-ranked findings"
  ultrareview: "/ultrareview [PR#] | deep multi-agent cloud review | billed"
  goal: "/goal <cond> | keep working until condition met"
  loop: "/loop [interval] [/cmd] | recurring task; no interval = self-paced"
  schedule: "/schedule | cloud scheduled task (routine)"
  tasks: "/tasks | list/stop subagents, loops, scheduled tasks, forks"
  workflows: "/workflows | view dynamic workflows; trigger keyword: ultracode"
  cd: "/cd <dir> | move session dir without breaking prompt cache"
  diff: "/diff | toggle uncommitted-changes panel"
  reload-skills: "/reload-skills | rescan skill dirs"
  skill-doctor: "/skill-doctor | unused skills + context cost → prune"
  doctor: "/doctor (/checkup) [prompt-audit] | config issues; audit prompts"
  config: "/config key=value | set any setting inline; --help lists keys"
  output-style: "/output-style [name] | list/switch output styles"
  auto-mode-setup: "/auto-mode-setup | teach auto mode your env"
  advisor: "/advisor [model|off] | pick advisor model"
  effort: "/effort | Faster↔Smarter slider; s = this session only"
  fast: "/fast | fast mode (Opus 5.5, Opus 4.8)"
  usage: "/usage | tokens, cost, loop breakdown, warnings"
  cost: "/cost | per-session prompt-cache hit ratio + miss cause"
  usage-credits: "/usage-credits | was /extra-usage"
  plugin: "/plugin [list|install <p> --marketplace <src>] | manage plugins"
  mcp: "/mcp [reconnect all] | MCP servers"
  session-start-hook: "/session-start-hook | SessionStart hook for web sessions"
  update-config: "/update-config | hooks, permissions, env in settings.json"
  fewer-permission-prompts: "/fewer-permission-prompts | allowlist read-only calls"
  keybindings-help: "/keybindings-help | edit keybindings.json"
  tui: "/tui [classic|default] | renderer"
  focus: "/focus | prompt + summary + response only"
removed:
  agents: "wizard removed → ask Claude or edit .claude/agents/"
  extra-usage: "→ /usage-credits (alias kept)"
hooks:  # event: block? | use
  PreToolUse: "yes | validate/inject before tool"
  PostToolUse: "no | log/follow-up"
  Notification: "no | alerts; agent_needs_input/agent_completed"
  Stop: "no | post-turn"
  SubagentStop: "no | aggregate subagent result"
  PreCompact: "yes | prevent compaction"
  TaskCreated: "no | track tasks"
  WorktreeCreate: "no | http → worktreePath"
  PermissionDenied: "no | {retry:true} re-runs classifier"
  PreModelSwitch: "yes | block/confirm model switch (new)"
  PostModelSwitch: "no | annotate model switch (new)"
  DirectoryAdded: "no | after /add-dir (new)"
  MessageDisplay: "n/a | transform/hide displayed text (new)"
  invoke_types: [shell, mcp_tool, http]
settings:
  skillOverrides: "off|user-invocable-only|name-only"
  disableBundledSkills: "hide bundled skills/workflows (env CLAUDE_CODE_DISABLE_BUNDLED_SKILLS)"
  disableSkillShellExecution: bool
  syncClaudeAiSkills: "bool; also syncClaudeAiPlugins"
  modelPicker: "ordered labeled model list"
  workflowSizeGuideline: "small|medium|large (advisory)"
  feedbackDrafts: bool
  showThinkingSummaries: bool
  autoScrollEnabled: bool
  prUrlTemplate: string
  sandbox.network.deniedDomains: "list[string]"
env:
  ANTHROPIC_DEFAULT_MODEL: "start model; /model still overrides"
  CLAUDE_EFFORT: "effort in skill templates"
  CLAUDE_CODE_SAFE_MODE: "1 = all customizations off (= --safe-mode)"
  CLAUDE_CODE_MAX_SUBAGENTS_PER_SESSION: "default 200"
  CLAUDE_CODE_NO_FLICKER: "1 = alt-screen renderer"
  CLAUDE_CODE_ENABLE_GATEWAY_MODEL_DISCOVERY: "1 = /v1/models discovery"
  CLAUDE_STREAM_IDLE_TIMEOUT_MS: int
  DISABLE_UPDATES: "1"
project_instructions: "CLAUDE.md; falls back to AGENTS.md when absent"
models:
  opus: claude-opus-5-5
  sonnet: claude-sonnet-5-5
  haiku: claude-haiku-5-5
  fable: claude-fable-5-2
