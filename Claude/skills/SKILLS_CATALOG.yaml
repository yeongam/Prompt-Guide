# Claude Code Skills Catalog
# Source: anthropics/claude-code (public)
# Maintained: yeongam/Prompt-Guide (auto-updated daily 00:00 UTC)
version: 2.1.178
updated: 2026-06-16

# ─── SKILLS ────────────────────────────────────────────────────────────────────
# Format: cmd | trigger | desc
skills:
  init:
    cmd: /init
    trigger: user asks to initialize or document codebase
    desc: Generate CLAUDE.md with codebase architecture, conventions, commands

  review:
    cmd: /review
    trigger: user asks to review PR or branch
    desc: Multi-pass PR review; checks logic, style, security, tests

  security-review:
    cmd: /security-review
    trigger: user asks security audit of current branch changes
    desc: OWASP-focused audit of pending diffs; outputs risk-ranked findings

  code-review:
    cmd: /code-review [--comment] [--fix] [effort]
    trigger: user asks to review code for bugs, efficiency, reuse at chosen effort level
    desc: Risk-ranked findings (correctness→reuse→efficiency); --fix applies inline
    added: v2.1.152

  simplify:
    cmd: /simplify
    trigger: user asks to clean up or refactor changed code (cleanup-only)
    desc: Review changed code for reuse/quality/efficiency, then fix issues

  session-start-hook:
    cmd: /session-start-hook
    trigger: user wants test/lint runners on session start (web Claude Code)
    desc: Create SessionStart hook ensuring project can run tests and linters

  update-config:
    cmd: /update-config
    trigger: automated behavior requests ("when X", "allow Y", "set Z=val")
    desc: Configure settings.json; handles hooks, permissions, env vars

  keybindings-help:
    cmd: /keybindings-help
    trigger: user wants to remap keys or add chord shortcuts
    desc: Customize ~/.claude/keybindings.json; supports chord bindings

  fewer-permission-prompts:
    cmd: /fewer-permission-prompts
    trigger: user wants fewer permission dialogs
    desc: Scan transcripts → add bash/MCP allowlist to .claude/settings.json

  loop:
    cmd: /loop [interval] [/command]
    trigger: user wants recurring task (e.g. "check every 5m", "keep running X")
    desc: Run prompt or slash command on recurring interval (default 10m)
    example: "/loop 5m /review"

  goal:
    cmd: /goal <condition>
    trigger: user wants Claude to work autonomously until a defined condition is met
    desc: Set completion condition; Claude iterates until met or blocked
    added: v2.1.139

  resume:
    cmd: /resume [session-id]
    trigger: user wants to return to or list background sessions
    desc: Attach to background session started with --bg --exec; no-arg = list all
    added: v2.1.144

  cd:
    cmd: /cd <path>
    trigger: user wants to switch working directory mid-session
    desc: Move session to new directory; preserves prompt cache, reloads CLAUDE.md
    added: v2.1.169

  reload-skills:
    cmd: /reload-skills
    trigger: user added or edited skill files and wants them active without restart
    desc: Re-scan .claude/skills/ directories; shows new/changed entries
    added: v2.1.152

  terminal-setup:
    cmd: /terminal-setup
    trigger: user wants to configure terminal rendering or GPU acceleration in IDE
    desc: Interactive terminal config wizard; saves to user config immediately
    added: v2.1.162

  scroll-speed:
    cmd: /scroll-speed [value]
    trigger: user wants to adjust mouse-wheel scroll speed in fullscreen TUI
    desc: Live-preview slider or direct value (1–10); see also wheelScrollAccelerationEnabled
    added: v2.1.139

  doctor:
    cmd: /doctor
    trigger: user wants to diagnose Claude Code configuration or connectivity issues
    desc: Flat-tree diagnostic layout with status icons and highlighted command names
    updated: v2.1.178

  claude-api:
    cmd: /claude-api
    trigger: code imports anthropic SDK; user asks about Claude API features
    desc: Build/debug Claude API apps; prompt caching, tool use, model migration
    models:
      fable: claude-fable-5
      opus: claude-opus-4-8
      sonnet: claude-sonnet-4-6
      haiku: claude-haiku-4-5-20251001

  ultrareview:
    cmd: /ultrareview [PR#]
    trigger: user says "ultrareview" or wants multi-agent review
    desc: Parallel multi-agent cloud code review; no-arg=local branch, arg=GitHub PR
    note: Billed; requires git repo

  ultraplan:
    cmd: /ultraplan
    trigger: user wants cloud environment for complex planning
    desc: Auto-create cloud worktrees/environments for multi-agent planning tasks

  team-onboarding:
    cmd: /team-onboarding
    trigger: user wants teammate ramp-up guide
    desc: Generate onboarding guide from local Claude Code usage history/data

  effort:
    cmd: /effort [level]
    trigger: user wants to adjust effort/quality level
    desc: "Levels: low | medium | high | max | xhigh (Opus 4.8 only)"
    added_level: "xhigh=v2.1.154"

  powerup:
    cmd: /powerup
    trigger: user wants feature demos or to learn Claude Code features
    desc: Interactive animated feature demos with lessons

  tui:
    cmd: /tui
    trigger: rendering looks flickery or user wants full-screen mode
    desc: Switch to flicker-free alt-screen TUI rendering (also: CLAUDE_CODE_NO_FLICKER)

  focus:
    cmd: /focus
    trigger: user wants compact view of conversation
    desc: Toggle focus view showing only prompt + tool summary + final response

  undo:
    cmd: /undo
    trigger: user wants to undo last action
    desc: Alias for /rewind; undoes last assistant action

  usage:
    cmd: /usage
    trigger: user asks about token or cost statistics
    desc: Show token usage and cost stats (merged /cost + /stats)

  theme:
    cmd: /theme [name]
    trigger: user wants to change or create visual theme
    desc: Create or switch custom color themes

  color:
    cmd: /color
    trigger: user wants a session color
    desc: Set random session color (no args = random pick)

# ─── HOOKS ─────────────────────────────────────────────────────────────────────
# Hooks execute shell commands or MCP tools on lifecycle events.
# Block: exit 2 OR return JSON {decision:"block", reason:"..."}
# Retry: return JSON {retry:true} (PermissionDenied only)
hooks:
  PreToolUse:
    fires: Before any tool execution
    can_block: true
    use: Validate/log before bash/file ops; inject context

  PostToolUse:
    fires: After tool completes
    can_block: false
    options: continueOnBlock (added v2.1.141)
    use: Log results, trigger follow-up actions

  Notification:
    fires: On push-notification events
    can_block: false
    use: Forward alerts to mobile/Slack

  Stop:
    fires: After assistant turn completes
    can_block: false
    use: Post-turn logging, notifications

  SubagentStop:
    fires: After subagent turn completes
    can_block: false
    use: Subagent result aggregation

  PreCompact:
    fires: Before conversation compaction
    can_block: true
    block_method: "exit 2 OR {decision:'block'}"
    added: v2.1.85
    use: Prevent compaction during critical operations

  TaskCreated:
    fires: When task created via TaskCreate tool
    can_block: false
    added: v2.1.90
    use: Log/track task creation events

  WorktreeCreate:
    fires: On worktree creation
    can_block: false
    added: v2.1.88
    type_http: returns hookSpecificOutput.worktreePath
    use: Custom worktree provisioning via HTTP endpoint

  PermissionDenied:
    fires: After auto-mode classifier denial
    can_block: false
    retry: "return {retry:true} to re-run classifier"
    added: v2.1.95
    use: Custom permission escalation flows

  MessageDisplay:
    fires: Before assistant message is rendered
    can_block: false
    added: v2.1.152
    use: Transform or suppress assistant message text

  SessionStart:
    fires: On session initialization
    can_block: false
    added: v2.1.152
    output: hookSpecificOutput.sessionTitle (set custom session title)
    use: Session-level setup, title injection

  hook_invoke_types:
    - type: shell          # shell command (default)
    - type: mcp_tool       # invoke MCP tool directly (added v2.1.118)
    - type: http           # HTTP endpoint (WorktreeCreate)
    hook_args_field: "args[] for exec form; spawns directly without shell (v2.1.141)"

# ─── SETTINGS ──────────────────────────────────────────────────────────────────
# Place in .claude/settings.json (project) or ~/.claude/settings.json (user)
settings:
  skillOverrides:
    type: "off | user-invocable-only | name-only"
    desc: "off=hidden from model+slash, user-invocable-only=hidden from model, name-only=minimal exposure"
    added: v2.1.126

  disableBundledSkills:
    type: bool
    desc: Hide bundled skills, workflows, and built-in slash commands from model
    added: v2.1.157

  disableSkillShellExecution:
    type: bool
    desc: Disable inline shell execution within skill definitions
    added: v2.1.98

  autoScrollEnabled:
    type: bool
    desc: Disable auto-scroll in fullscreen TUI mode
    added: v2.1.100

  showThinkingSummaries:
    type: bool
    default: false
    desc: Control thinking summary generation in responses
    added: v2.1.95

  wheelScrollAccelerationEnabled:
    type: bool
    desc: Disable mouse-wheel scroll acceleration in fullscreen mode
    added: v2.1.174

  enforceAvailableModels:
    type: bool
    scope: managed
    desc: Constrain Default model to availableModels allowlist; blocks user widening
    added: v2.1.175

  requiredMinimumVersion:
    type: string
    scope: managed
    desc: Enforce minimum Claude Code version (e.g. "2.1.163")
    added: v2.1.163

  requiredMaximumVersion:
    type: string
    scope: managed
    desc: Enforce maximum Claude Code version
    added: v2.1.163

  footerLinksRegexes:
    type: "list[string]"
    desc: Regex patterns for link badges displayed in session footer row
    added: v2.1.162

  language:
    type: string
    desc: Session language for generated titles and UI elements (e.g. "ko", "en")
    added: v2.1.176

  prUrlTemplate:
    type: string
    desc: Custom URL template for PR footer badge (e.g. custom code-review tools)
    added: v2.1.101

  worktree.baseRef:
    type: "'fresh' | 'head'"
    desc: Choose worktree base ref; 'fresh'=clean main, 'head'=current HEAD
    added: v2.1.154

  autoMode.hard_deny:
    type: "list[rule]"
    desc: Auto mode classifier rules that block unconditionally (no retry)
    added: v2.1.154

  pluginSuggestionMarketplaces:
    type: "list[string]"
    scope: managed
    desc: Allowlist org marketplaces for plugin suggestions in /plugin
    added: v2.1.152

  sandbox.network.deniedDomains:
    type: "list[string]"
    desc: Block specific domains even when broader allowlists exist
    added: v2.1.85

# ─── ENV VARS ──────────────────────────────────────────────────────────────────
env:
  CLAUDE_EFFORT: "Current effort level; usable in skill template strings as ${CLAUDE_EFFORT}"
  CLAUDE_CODE_NO_FLICKER: "1 = enable alt-screen flicker-free rendering (same as /tui)"
  CLAUDE_CODE_USE_POWERSHELL_TOOL: "1 = enable PowerShell tool (Windows opt-in preview)"
  CLAUDE_STREAM_IDLE_TIMEOUT_MS: "Integer ms for streaming idle watchdog timeout"
  OTEL_LOG_RAW_API_BODIES: "1 = emit full API request/response bodies as OTEL events"
  DISABLE_UPDATES: "1 = block all update paths including manual 'claude update'"
  CLAUDE_CODE_ENABLE_GATEWAY_MODEL_DISCOVERY: "1 = opt-in gateway /v1/models discovery"
  CLAUDE_CODE_SESSION_ID: "Passed to stdio MCP servers and hooks for session identification"
  CLAUDE_CODE_ENABLE_AUTO_MODE: "1 = opt-in auto mode on Bedrock/Vertex/Foundry providers"
  CLAUDE_CODE_SAFE_MODE: "1 = start with all customizations disabled (CLAUDE.md, plugins, skills, hooks, MCP)"
  CLAUDE_CODE_DISABLE_BUNDLED_SKILLS: "1 = hide bundled skills/workflows from model"
  CLAUDE_CODE_ALWAYS_ENABLE_EFFORT: "1 = force effort parameter on all models"
  ANTHROPIC_WORKSPACE_ID: "Workload identity federation workspace scoping"

# ─── MODELS ────────────────────────────────────────────────────────────────────
models:
  default: claude-sonnet-4-6
  fable: claude-fable-5          # Mythos-class; general availability (added v2.1.170)
  opus: claude-opus-4-8          # xhigh effort default; 2x cost 2.5x speed (added v2.1.154)
  opus_legacy: claude-opus-4-7   # Fast mode available; Max subscribers only auto mode
  sonnet: claude-sonnet-4-6
  haiku: claude-haiku-4-5-20251001
  fast_mode_default: claude-opus-4-7  # switched from 4.6 (v2.1.142)

# ─── PERMISSION RULES ──────────────────────────────────────────────────────────
# Parameter-matching syntax added v2.1.178
permissions:
  syntax:
    basic: "ToolName"
    with_param: "Tool(param:value)"
    wildcard_domain: "WebFetch(domain:*.example.com)"
    wildcard_path: "Read(secrets-*/config.json)"
    subagent_model: "Agent(model:opus)"
  notes:
    - "Nested .claude/ dirs inherit with closest-directory precedence (v2.1.178)"
    - "Nested subagents supported up to 5 levels deep (v2.1.172)"
    - "--safe-mode CLI flag disables all customizations for troubleshooting (v2.1.169)"

# ─── TOKEN OPTIMIZATION NOTES ──────────────────────────────────────────────────
