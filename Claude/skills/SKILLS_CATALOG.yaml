# Claude Code Skills Catalog (compact)
# Source: anthropics/claude-code | Sync: daily 00:00 UTC | Fmt: name: cmd | when | what
version: 2.1.289
updated: 2026-10-05

skills:
  init: /init | document codebase | Generate CLAUDE.md (AGENTS.md read if no CLAUDE.md)
  code-review: /code-review [low|high|max] [--comment|--fix|--max-findings n|all] | review PR/branch/diff | Correctness review at effort level; inline PR/GitLab MR comments (replaces /review)
  security-review: /security-review | security audit of branch | OWASP-focused, risk-ranked
  simplify: /simplify | clean up changed code | Reuse/quality/efficiency review, then fix
  ultrareview: /ultrareview [PR#] | multi-agent review | Cloud parallel review (billed); no arg=local branch
  ultraplan: /ultraplan | complex planning | Cloud worktrees for multi-agent planning
  goal: /goal | long-running objective | Hook-driven autonomous loop; auto-retry/backoff; survives resume
  loop: /loop [interval] [/cmd] | recurring task | Interval prompt/command (default 10m)
  plan: /plan | plan first | Switch to plan mode
  btw: /btw | side question | Ask without interrupting main turn
  workflows: /workflows | multi-agent runs | List/monitor Workflow runs
  session-start-hook: /session-start-hook | web test/lint setup | Create SessionStart hook
  update-config: /update-config | "when X"/allow/env | Edit settings.json (hooks, permissions, env)
  keybindings-help: /keybindings-help | remap keys | Edit ~/.claude/keybindings.json (chords)
  fewer-permission-prompts: /fewer-permission-prompts | fewer dialogs | Allowlist read-only calls from transcripts
  claude-api: /claude-api | anthropic SDK code | API/caching/tool use/model migration
  dataviz: /dataviz | chart/dashboard | Consistent accessible data visualization
  skill-doctor: /skill-doctor | prune skills | Show unused skills + context cost
  reload-skills: /reload-skills | skills changed on disk | Reload skills in session
  reload-plugins: /reload-plugins | plugins changed | Reload plugins (also headless)
  team-onboarding: /team-onboarding | teammate ramp-up | Guide from local usage history
  insights: /insights | usage review | Session insights + auto-mode prompt estimate
  doctor: /doctor | config problems | Diagnose setup; flags oversized CLAUDE.md
  effort: /effort | adjust effort | Slider; `s`=session only; maxEffortLevel caps
  usage: /usage | tokens/cost | Usage, spend limit, per-loop breakdown (cost merged in)
  focus: /focus | compact view | Prompt + summary + response only
  diff: /diff | see changes | Side diff panel (fullscreen)
  undo: /undo | revert | Alias of /rewind
  advisor: /advisor [model|off] | second-opinion model | Toggle advisor
  cd: /cd | change dir | Switch working dir (path suggestions)
  export: /export | save chat | Copy/save conversation text
  feedback: /feedback | report issue | Review/send drafted reports
  web-setup: /web-setup | web sessions | Connect GitHub for Claude Code on the web
  teleport: /teleport | continue cloud session locally | claude --teleport <id>
  tui: /tui | flicker | Alt-screen rendering
  powerup: /powerup | learn features | Interactive demos
  theme: /theme [name] | colors | Create/switch theme
  color: /color | session color | Random color
  # removed upstream: /review (->code-review), /agents wizard (edit .claude/agents/ or ask Claude), /cost+/stats (->usage)

hooks:  # shell|mcp_tool|http; block=exit 2 or {decision:"block"}
  PreToolUse: before tool; blockable
  PostToolUse: after tool
  PermissionRequest: on permission ask; command/http only (agent type unsupported)
  PermissionDenied: after auto-mode denial; {retry:true}
  UserPromptSubmit: on prompt submit
  SessionStart: start/resume (gets staleness+re-cache cost)
  Setup: one-time setup
  Notification: push events (agent_needs_input, agent_completed)
  Stop: turn end
  SubagentStart: subagent begin
  SubagentStop: subagent end
  PreCompact: before compaction; blockable
  TaskCreated: TaskCreate
  WorktreeCreate: worktree create; http returns hookSpecificOutput.worktreePath
  DirectoryAdded: after /add-dir
  PreModelSwitch/PostModelSwitch: block/confirm/annotate model switch
  ConfigChange: settings changed
  MessageDisplay: message render

settings:  # .claude/settings.json | ~/.claude/settings.json
  skillOverrides: off|user-invocable-only|name-only
  disableSkillShellExecution: bool
  maxEffortLevel: cap effort (also per modelSettings)
  promptCacheTtl/subagentPromptCacheTtl: 5m|1h
  bashOutputMaxChars/taskOutputMaxChars: inline output cap (<=128K)
  modelPicker: curated /model list
  attribution: false hides commit/PR attribution
  sandbox.network.strictAllowlist|deniedDomains, sandbox.filesystem.disabled: bool/list
  workflowSizeGuideline: small|medium|large
  maxProseWidth, timeFormat, timeZone, keybindingFlavor, spellcheck, emojiCompletionEnabled, vimInsertModeRemaps, axScreenReader: UI
  managed: allowedProviders, availableModelsMatch, deniedModels, managedMcpServers, modelPricing

env:
  CLAUDE_EFFORT: effort level (${CLAUDE_EFFORT} in skills)
  ANTHROPIC_DEFAULT_MODEL: start model (/model overrides)
  CLAUDE_CODE_RESTRICTED: 1=--restricted (no exec tools/WebFetch)
  CLAUDE_CODE_DISABLE_WEB_FETCH: 1=off
  CLAUDE_CODE_MAX_CONCURRENT_SUBAGENTS: default 20
  CLAUDE_CODE_MAX_SUBAGENTS_PER_SESSION: default 200
  CLAUDE_CODE_MAX_WEB_SEARCHES_PER_SESSION: default 200
  CLAUDE_CODE_WORKFLOW_MAX_CONCURRENT_AGENTS: 1-256
  CLAUDE_CODE_MAX_MCP_DESCRIPTION_LENGTH: default 2048
  CLAUDE_CODE_MCP_STARTUP_WAIT_MS: 0=no wait
  CLAUDE_CODE_TOOL_MEMORY_LIMIT: Linux cgroup cap for Bash
  CLAUDE_CODE_NO_FLICKER: 1=/tui
  DISABLE_UPDATES: 1=block updates

models:
  default: claude-sonnet-5-5
  fable: claude-fable-5-1
  opus: claude-opus-5-5   # fast mode: Opus 5/4.8
  sonnet: claude-sonnet-5-5
  haiku: claude-haiku-4-5-20251001
