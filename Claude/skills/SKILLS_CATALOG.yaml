# Claude Code catalog | src: anthropics/claude-code | v2.1.284 | 2026-09-29
# fmt: cmd: trigger -> action
version: 2.1.284
updated: 2026-09-29
skills:
  init: "/init: init/document codebase -> generate CLAUDE.md (AGENTS.md read if no CLAUDE.md)"
  code-review: "/code-review [low..max] [PR|branch] [--comment|--fix|ultra]: review diff -> correctness bugs; --comment posts PR comments (replaces /review)"
  ultrareview: "/ultrareview [PR#]: multi-agent cloud review (billed; needs git repo)"
  security-review: "/security-review: audit pending branch diff -> risk-ranked findings"
  simplify: "/simplify: cleanup-only review (reuse/simplify/efficiency) -> applies fixes"
  dataviz: "/dataviz: charts/dashboards -> palette + validator guidance"
  goal: "/goal <condition>: keep working across turns until met (interactive, -p, RC)"
  loop: "/loop [interval] [cmd]: recurring prompt/command; no interval=self-paced"
  claude-api: "/claude-api [upgrade|prompt-audit]: Claude API/SDK apps, caching, tool use, migration"
  doctor: "/doctor (alias /checkup) [prompt-audit]: diagnose+fix setup; audit CLAUDE.md/skills for old-model patterns"
  skill-doctor: "/skill-doctor: show unused skills + context cost -> prune"
  reload-skills: "/reload-skills: rescan skill dirs, no restart"
  session-start-hook: "/session-start-hook: SessionStart hook so web sessions can run tests/linters"
  update-config: "/update-config: settings.json (hooks, permissions, env)"
  keybindings-help: "/keybindings-help: edit ~/.claude/keybindings.json"
  fewer-permission-prompts: "/fewer-permission-prompts: transcript scan -> read-only allowlist"
  ultraplan: "/ultraplan: cloud multi-agent planning"
  team-onboarding: "/team-onboarding: teammate guide from usage history"
  powerup: "/powerup: interactive feature lessons"
cmds: # non-skill commands
  session: ["/cd <dir>", "/add-dir", "/plan", "/focus", "/tui", "/diff", "/rewind (=/undo)", "/export", "/copy", "/tasks", "/status", "/sandbox", "/chrome"]
  usage: ["/usage (cost+stats+loops)", "/cost (cache hit/miss)", "/usage-credits (was /extra-usage)"]
  config: ["/effort", "/model", "/fast (Opus 5/4.8)", "/theme", "/color", "/scroll-speed", "/config", "/permissions", "/advisor"]
  plugin: ["/plugin", "/reload-plugins", "/workflows", "/web-setup"]
  removed: ["/agents wizard (edit .claude/agents/ or ask Claude)", "/review->/code-review"]
hooks: # block: exit 2 | {decision:block,reason}; `if` = permission-rule syntax
  block-capable: ["PreToolUse", "PreCompact(2.1.85)", "PreModelSwitch"]
  observe: ["PostToolUse(continueOnBlock)", "Notification(agent_needs_input|agent_completed)", "Stop", "SubagentStop", "TaskCreated(2.1.90)", "WorktreeCreate(2.1.88)", "PermissionDenied(retry:true;2.1.95)", "PostModelSwitch", "DirectoryAdded", "MessageDisplay(transform/hide text)", "SessionStart(resume: staleness+recache cost)"]
  types: ["shell (args:string[] = exec form)", "mcp_tool(2.1.118)", "http"]
  output: ["terminalSequence"]
settings:
  skillOverrides: "off|user-invocable-only|name-only"
  disableBundledSkills: "hide bundled skills/builtin cmds (env CLAUDE_CODE_DISABLE_BUNDLED_SKILLS)"
  disableSkillShellExecution: bool
  syncClaudeAiSkills/syncClaudeAiPlugins: "false=opt out of account sync"
  maxEffortLevel: "cap effort, all providers"
  bashOutputMaxChars/taskOutputMaxChars: "inline output cap (<=128K)"
  maxProseWidth/timeFormat/timeZone: display
  attribution: "false=hide commit/PR attribution"
  deniedModels/availableModelsMatch/managedMcpServers: managed
  prUrlTemplate/showThinkingSummaries/autoScrollEnabled/sandbox.network.deniedDomains: unchanged
env:
  CLAUDE_CODE_SAFE_MODE: "=--safe-mode; disable all customizations"
  CLAUDE_CODE_RESTRICTED: "=--restricted; no command/code tools or WebFetch"
  CLAUDE_CODE_SUBAGENT_MODEL_FORCE: "force subagent model"
  CLAUDE_CODE_MAX_MCP_DESCRIPTION_LENGTH: "MCP desc cap (def 2048)"
  CLAUDE_CODE_MCP_STARTUP_WAIT_MS: "0=no wait"
  CLAUDE_CODE_WORKFLOW_MAX_CONCURRENT_AGENTS: "1-256"
  CLAUDE_CODE_GOAL_CHECKIN_MINUTES: "0=off"
  CLAUDE_CODE_SESSION_ID: "in Bash env"
  CLAUDE_EFFORT/CLAUDE_CODE_NO_FLICKER/CLAUDE_CODE_ENABLE_GATEWAY_MODEL_DISCOVERY/DISABLE_UPDATES/CLAUDE_STREAM_IDLE_TIMEOUT_MS/OTEL_LOG_RAW_API_BODIES: unchanged
models:
  default: claude-sonnet-5-5
  opus: claude-opus-5-5      # 1M ctx, fast mode
  sonnet: claude-sonnet-5-5  # 1M ctx
  fable: claude-fable-5-1
  haiku: claude-haiku-4-5-20251001
