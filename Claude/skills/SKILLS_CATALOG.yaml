env:
  ANTHROPIC_DEFAULT_SONNET_MODEL: "Override default Sonnet model (v2.1.174)"
  CLAUDE_CODE_SUBAGENT_MODEL: "Sub-agent model override (v2.1.147)"
  CLAUDE_CODE_SESSION_ID: "Session ID in stdio MCP + Bash subprocess env (v2.1.132/154)"
  CLAUDE_PROJECT_DIR: "Project dir in MCP/hook environments (v2.1.140)"
  CLAUDE_EFFORT: "Current effort level; usable in skill template strings"
  CLAUDE_CODE_NO_FLICKER: "1 = alt-screen rendering (same as /tui)"
  CLAUDE_CODE_USE_POWERSHELL_TOOL: "1 = PowerShell tool (Windows preview)"
  CLAUDE_CODE_DISABLE_BUNDLED_SKILLS: "Disable built-in skills (v2.1.163)"
  CLAUDE_CODE_STOP_HOOK_BLOCK_CAP: "Max stop-hook blocks; default 8 (v2.1.147)"
  CLAUDE_CODE_DISABLE_ALTERNATE_SCREEN: "1 = native scrollback mode (v2.1.132)"
  CLAUDE_CODE_PLUGIN_PREFER_HTTPS: "SSH->HTTPS plugin cloning (v2.1.141)"
  CLAUDE_CODE_ENABLE_FEEDBACK_SURVEY_FOR_OTEL: "Re-enable surveys for OTel (v2.1.139)"
  CLAUDE_STREAM_IDLE_TIMEOUT_MS: "Streaming idle watchdog timeout (ms)"
  OTEL_LOG_RAW_API_BODIES: "1 = full API request/response bodies as OTEL events"
  OTEL_LOG_TOOL_DETAILS: "Tool parameter telemetry (v2.1.161)"
  OTEL_RESOURCE_ATTRIBUTES: "Included as metric labels (v2.1.161)"
  DISABLE_UPDATES: "1 = block all update paths including 'claude update'"
  CLAUDE_CODE_ENABLE_GATEWAY_MODEL_DISCOVERY: "1 = opt-in gateway /v1/models discovery"
  ANTHROPIC_WORKSPACE_ID: "Workload identity federation (v2.1.141)"
  CLAUDE_CODE_OPUS_4_6_FAST_MODE_OVERRIDE: "Override fast mode base model (v2.1.142)"

# ─── MODELS ────────────────────────────────────────────────────────────────────
models:
  default: claude-sonnet-4-6
  fable5: claude-fable-5          # Mythos-class; added v2.1.170
  opus48: claude-opus-4-8         # High effort default; added v2.1.154
  opus47: claude-opus-4-7         # Fast mode base
  sonnet: claude-sonnet-4-6
  haiku: claude-haiku-4-5-20251001

# ─── TOKEN OPTIMIZATION NOTES ──────────────────────────────────────────────────
# - YAML over JSON/Markdown: ~30% fewer tokens for structured data
# - Descriptions capped at one line; examples only where non-obvious
# - version tags kept for audit; drop if tokens critical
# - Dated snapshots in skills/YYYY-MM-DD/ for diff tracking
# - SKILLS_CATALOG.yaml is the canonical runtime source; dated dirs are archives
