# Claude Code Skills Catalog
# Source: anthropics/claude-code (public)
# Maintained: yeongam/Prompt-Guide (auto-updated daily 00:00 UTC)
version: 2.1.175
updated: 2026-06-12

# ─── SKILLS ────────────────────────────────────────────────────────────────────
# Format: cmd | trigger | desc
skills:
  init:
    cmd: /init
    trigger: user asks to initialize or document codebase
    desc: Generate CLAUDE.md with codebase architecture, conventions, commands

  review:
    cmd: /review
    trigger: user asks to review PR or branch
    desc: Multi-pass PR review; checks logic, style, security, tests

  security-review:
    cmd: /security-review
    trigger: user asks security audit of current branch changes
    desc: OWASP-focused audit of pending diffs; outputs risk-ranked findings

  simplify:
    cmd: /simplify
    trigger: user asks to clean up or refactor changed code
    desc: Cleanup-only review of changed code; auto-applies fixes (v2.1.154)

  code-review:
    cmd: /code-review [--fix] [--comment] [PR#]
    trigger: user asks for full code review with optional auto-fix or GitHub comments
    desc: Full review with effort levels; --fix applies findings; --comment posts inline PR comments (v2.1.147)

  session-start-hook:
    cmd: /session-start-hook
    trigger: user wants test/lint runners on session start (web Claude Code)
    desc: Create SessionStart hook ensuring project can run tests and linters

  update-config:
    cmd: /update-config
    trigger: automated behavior requests ("when X", "allow Y", "set Z=val")
    desc: Configure settings.json; handles hooks, permissions, env vars

  keybindings-help:
    cmd: /keybindings-help
    trigger: user wants to remap keys or add chord shortcuts
    desc: Customize ~/.claude/keybindings.json; supports chord bindings

  fewer-permission-prompts:
    cmd: /fewer-permission-prompts
    trigger: user wants fewer permission dialogs
    desc: Scan transcripts → add bash/MCP allowlist to .claude/settings.json

  loop:
    cmd: /loop [interval] [/command]
    trigger: user wants recurring task (e.g. "check every 5m", "keep running X")
    desc: Run prompt or slash command on recurring interval (default 10m)
    example: "/loop 5m /review"

  claude-api:
    cmd: /claude-api
    trigger: code imports anthropic SDK; user asks about Claude API features
    desc: Build/debug Claude API apps; prompt caching, tool use, model migration
    models:
      fable5: claude-fable-5
      opus48: claude-opus-4-8
      opus47: claude-opus-4-7
      sonnet: claude-sonnet-4-6
      haiku: claude-haiku-4-5-20251001

  ultrareview:
    cmd: /ultrareview [PR#]
    trigger: user says "ultrareview" or wants multi-agent review
    desc: Parallel multi-agent cloud code review; no-arg=local branch, arg=GitHub PR

  ultraplan:
    cmd: /ultraplan
    trigger: user wants cloud environment for complex planning
    desc: Auto-create cloud worktrees/environments for multi-agent planning tasks

  team-onboarding:
    cmd: /team-onboarding
    trigger: user wants teammate ramp-up guide
    desc: Generate onboarding guide from local Claude Code usage history/data

  effort:
    cmd: /effort [level]
    trigger: user wants to adjust effort/quality level
    desc: Interactive slider; labels are Faster/Smarter (changed v2.1.154); CLAUDE_EFFORT env var

  powerup:
    cmd: /powerup
    trigger: user wants feature demos or to learn Claude Code features
    desc: Interactive animated feature demos with lessons

  tui:
    cmd: /tui
    trigger: rendering looks flickery or user wants full-screen mode
    desc: Switch to flicker-free alt-screen TUI rendering (CLAUDE_CODE_NO_FLICKER)

  focus:
    cmd: /focus
    trigger: user wants compact view of conversation
    desc: Toggle focus view showing only: prompt + tool summary + final response

  undo:
    cmd: /undo
    trigger: user wants to undo last action
    desc: Alias for /rewind; undoes last assistant action

  usage:
    cmd: /usage
    trigger: user asks about token or cost statistics
    desc: Show token/cost stats with per-category breakdown (skills, agents, plugins, MCP)

  theme:
    cmd: /theme [name]
    trigger: user wants to change or create visual theme
    desc: Create or switch custom color themes

  color:
    cmd: /color
    trigger: user wants a session color
    desc: Set random session color (no args = random pick)

  reload-skills:
    cmd: /reload-skills
    trigger: user wants to reload skills without restarting session
    desc: Re-scan skill directories mid-session (v2.1.152)

  cd:
    cmd: /cd [path]
    trigger: user wants to move session to a different directory
    desc: Move session to new directory without breaking cache (v2.1.163)

  plugin:
    cmd: /plugin list [--enabled|--disabled]
    trigger: user wants to manage or list plugins
    desc: List plugins with filter support; claude plugin init <name> scaffolds new plugins (v2.1.141/163)

  goal:
    cmd: /goal
    trigger: user wants to set a completion condition for ongoing work
    desc: Set completion condition with live overlay panel; persists across turns (v2.1.140)

  scroll-speed:
    cmd: /scroll-speed
    trigger: user wants to adjust scroll speed
    desc: Tune mouse wheel speed with live preview (v2.1.140)

  resume:
    cmd: /resume
    trigger: user wants to resume a background session
    desc: Resume background sessions marked bg (v2.1.144)

  diff:
    cmd: /diff
    trigger: user wants to navigate diffs
    desc: Detail view with keyboard navigation: arrows, vim keys, pagination (v2.1.150)

  workflows:
    cmd: /workflows
    trigger: user wants to view agent workflow runs
    desc: View dynamic workflow runs; supports 10-100+ agent orchestration (v2.1.154)

  chrome:
    cmd: /chrome
    trigger: multiple browsers connected; user wants to select one
    desc: Browser selection when multiple Chrome instances are connected (v2.1.154)

# ─── HOOKS ─────────────────────────────────────────────────────────────────────
hooks:
  PreToolUse:
    fires: Before any tool execution
    can_block: true
    use: Validate/log before bash/file ops; inject context

  PostToolUse:
    fires: After tool completes
    can_block: false
    use: Log results, trigger follow-up actions

  Notification:
    fires: On push-notification events
    can_block: false
    use: Forward alerts to mobile/Slack

  Stop:
    fires: After assistant turn completes
    can_block: false
    returns: additionalContext (v2.1.163)
    use: Post-turn logging, notifications, feedback injection

  SubagentStop:
    fires: After subagent turn completes
    can_block: false
    returns: additionalContext (v2.1.163)
    use: Subagent result aggregation

  PreCompact:
    fires: Before conversation compaction
    can_block: true
    block_method: "exit 2 OR {decision:'block'}"
    added: v2.1.85

  TaskCreated:
    fires: When task created via TaskCreate tool
    can_block: false
    added: v2.1.90

  WorktreeCreate:
    fires: On worktree creation
    can_block: false
    added: v2.1.88
    type: http
    returns: hookSpecificOutput.worktreePath

  PermissionDenied:
    fires: After auto-mode classifier denial
    can_block: false
    retry: "return {retry:true} to re-run classifier"
    added: v2.1.95

  MessageDisplay:
    fires: Transforms assistant message before display
    can_block: false
    added: v2.1.152
    use: Custom message rendering/filtering

  SessionStart:
    fires: On session start
    can_block: false
    added: v2.1.152
    returns: "reloadSkills: true, sessionTitle: string"
    use: Session initialization; force skill reload

  hook_invoke_types:
    - type: shell
    - type: mcp_tool       # v2.1.118
    - type: http           # WorktreeCreate only

# ─── SETTINGS ──────────────────────────────────────────────────────────────────
settings:
  skillOverrides:
    type: "off | user-invocable-only | name-only"
    added: v2.1.126

  disableBundledSkills:
    type: bool
    added: v2.1.163

  fallbackModel:
    type: "list (max 3)"
    flag: --fallback-model
    added: v2.1.166

  enforceAvailableModels:
    type: bool
    desc: Constrain default model; prevent allowlist widening
    added: v2.1.175

  wheelScrollAccelerationEnabled:
    type: bool
    added: v2.1.174

  autoScrollEnabled:
    type: bool
    added: v2.1.100

  showThinkingSummaries:
    type: bool
    default: false
    added: v2.1.95

  disableSkillShellExecution:
    type: bool
    added: v2.1.98

  acceptEdits:
    type: bool
    desc: Safer automated edit mode
    added: v2.1.160

  worktree.baseRef:
    type: "fresh | head"
    added: v2.1.133

  worktree.bgIsolation:
    type: "none"
    desc: For repos where worktrees are impractical
    added: v2.1.143

  parentSettingsBehavior:
    type: "first-wins | merge"
    added: v2.1.133

  sandbox.network.deniedDomains:
    type: "list[string]"
    added: v2.1.85

  requiredMinimumVersion:
    type: string
    added: v2.1.163

  requiredMaximumVersion:
    type: string
    added: v2.1.163

  pluginSuggestionMarketplaces:
    type: "list[string]"
    added: v2.1.152

  allowAllClaudeAiMcps:
    type: bool
    desc: Enterprise managed MCP setting
    added: v2.1.150

  prUrlTemplate:
    type: string
    added: v2.1.101

  sandbox.bwrapPath:
    type: string
    added: v2.1.133

  sandbox.socatPath:
    type: string
    added: v2.1.133

