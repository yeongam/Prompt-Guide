# Claude Code Skills Catalog
# Source: anthropics/claude-code (public)
# Maintained: yeongam/Prompt-Guide (auto-updated daily 00:00 UTC)
version: 2.1.167
updated: 2026-06-06

# ─── SKILLS ────────────────────────────────────────────────────────────────────
# Format: cmd | trigger | desc
skills:
  init:
    cmd: /init
    trigger: user asks to initialize or document codebase
    desc: Generate CLAUDE.md with codebase architecture, conventions, commands

  review:
    cmd: /review
    trigger: user asks to review PR or branch
    desc: Multi-pass PR review; checks logic, style, security, tests

  security-review:
    cmd: /security-review
    trigger: user asks security audit of current branch changes
    desc: OWASP-focused audit of pending diffs; outputs risk-ranked findings

  code-review:
    cmd: /code-review [effort] [--comment] [--fix]
    trigger: user asks to review current diff or clean up changed code
    desc: Diff review for correctness/reuse/efficiency; --comment posts inline PR comments; --fix applies findings
    added: v2.1.147
    note: Replaces /simplify from v2.1.147

  simplify:
    cmd: /simplify
    trigger: legacy alias; use /code-review instead
    desc: Deprecated v2.1.147; redirects to /code-review
    deprecated: true

  session-start-hook:
    cmd: /session-start-hook
    trigger: user wants test/lint runners on session start (web Claude Code)
    desc: Create SessionStart hook ensuring project can run tests and linters

  update-config:
    cmd: /update-config
    trigger: automated behavior requests ("when X", "allow Y", "set Z=val")
    desc: Configure settings.json; handles hooks, permissions, env vars

  keybindings-help:
    cmd: /keybindings-help
    trigger: user wants to remap keys or add chord shortcuts
    desc: Customize ~/.claude/keybindings.json; supports chord bindings

  fewer-permission-prompts:
    cmd: /fewer-permission-prompts
    trigger: user wants fewer permission dialogs
    desc: Scan transcripts → add bash/MCP allowlist to .claude/settings.json

  loop:
    cmd: /loop [interval] [/command]
    trigger: user wants recurring task (e.g. "check every 5m", "keep running X")
    desc: Run prompt or slash command on recurring interval (default 10m)
    example: "/loop 5m /review"

  claude-api:
    cmd: /claude-api
    trigger: code imports anthropic SDK; user asks about Claude API features
    desc: Build/debug Claude API apps; prompt caching, tool use, model migration
    models:
      opus: claude-opus-4-8
      sonnet: claude-sonnet-4-6
      haiku: claude-haiku-4-5-20251001

  ultrareview:
    cmd: /ultrareview [PR#]
    trigger: user says "ultrareview" or wants multi-agent review
    desc: Parallel multi-agent cloud code review; no-arg=local branch, arg=GitHub PR
    note: Billed; requires git repo; no GitHub remote needed for local mode

  ultraplan:
    cmd: /ultraplan
    trigger: user wants cloud environment for complex planning
    desc: Auto-create cloud worktrees/environments for multi-agent planning tasks

  team-onboarding:
    cmd: /team-onboarding
    trigger: user wants teammate ramp-up guide
    desc: Generate onboarding guide from local Claude Code usage history/data

  effort:
    cmd: /effort
    trigger: user wants to adjust effort/quality level
    desc: Interactive slider; labels "Faster"/"Smarter"; persists as session default

  powerup:
    cmd: /powerup
    trigger: user wants feature demos or to learn Claude Code features
    desc: Interactive animated feature demos with lessons

  tui:
    cmd: /tui
    trigger: rendering looks flickery or user wants full-screen mode
    desc: Switch to flicker-free alt-screen TUI rendering (also: CLAUDE_CODE_NO_FLICKER)

  focus:
    cmd: /focus
    trigger: user wants compact view of conversation
    desc: Toggle focus view showing only: prompt + tool summary + final response

  undo:
    cmd: /undo
    trigger: user wants to undo last action
    desc: Alias for /rewind; undoes last assistant action

  usage:
    cmd: /usage
    trigger: user asks about token or cost statistics
    desc: Per-category token/cost breakdown (skills, subagents, plugins, MCP servers)
    added: v2.1.149

  theme:
    cmd: /theme [name]
    trigger: user wants to change or create visual theme
    desc: Create or switch custom color themes

  color:
    cmd: /color
    trigger: user wants a session color
    desc: Set random session color (no args = random pick)

  goal:
    cmd: /goal
    trigger: user wants Claude to keep working until a condition is met
    desc: Set completion condition; Claude continues autonomously until met
    added: v2.1.139

  scroll-speed:
    cmd: /scroll-speed
    trigger: user wants to tune mouse wheel scroll speed
    desc: Adjust mouse wheel speed with live preview
    added: v2.1.139

  model:
    cmd: /model
    trigger: user wants to change the model for the current session
    desc: Change model for current session only; press d to set as default
    added: v2.1.144

  reload-skills:
    cmd: /reload-skills
    trigger: user added/edited skill files and wants them reloaded without restart
    desc: Re-scan .claude/skills/ directories without restarting Claude Code
    added: v2.1.152

  workflows:
    cmd: /workflows
    trigger: user wants to view workflow runs or dynamic workflow status
    desc: View dynamic workflow runs (preview feature)
    added: v2.1.154

  voice:
    cmd: /voice
    trigger: user wants voice input/output mode
    desc: Toggle voice interaction mode
    added: v2.1.166

  login:
    cmd: /login
    trigger: user needs to authenticate or switch accounts
    desc: Trigger authentication flow or account login
    added: v2.1.166

# ─── HOOKS ─────────────────────────────────────────────────────────────────────
# Hooks execute shell commands or MCP tools on lifecycle events.
# Block: exit 2 OR return JSON {decision:"block", reason:"..."}
# Retry: return JSON {retry:true} (PermissionDenied only)
# Conditional: add `if` field using permission rule syntax
# exec form: use args: string[] to spawn without shell (v2.1.139)
hooks:
  PreToolUse:
    fires: Before any tool execution
    can_block: true
    use: Validate/log before bash/file ops; inject context

  PostToolUse:
    fires: After tool completes
    can_block: false
    use: Log results, trigger follow-up actions

  Notification:
    fires: On push-notification events
    can_block: false
    use: Forward alerts to mobile/Slack (requires Remote Control setup)

  Stop:
    fires: After assistant turn completes
    can_block: false
    output: hookSpecificOutput.additionalContext injects context for next turn (v2.1.163)
    use: Post-turn logging, notifications, context injection

  SubagentStop:
    fires: After subagent turn completes
    can_block: false
    output: hookSpecificOutput.additionalContext (v2.1.163)
    use: Subagent result aggregation

  PreCompact:
    fires: Before conversation compaction
    can_block: true
    block_method: "exit 2 OR {decision:'block'}"
    added: v2.1.85
    use: Prevent compaction during critical operations

  TaskCreated:
    fires: When task created via TaskCreate tool
    can_block: false
    added: v2.1.90
    use: Log/track task creation events

  WorktreeCreate:
    fires: On worktree creation
    can_block: false
    added: v2.1.88
    type_http: returns hookSpecificOutput.worktreePath
    use: Custom worktree provisioning via HTTP endpoint

  PermissionDenied:
    fires: After auto-mode classifier denial
    can_block: false
    retry: "return {retry:true} to re-run classifier"
    added: v2.1.95
    use: Custom permission escalation flows

  EnterWorktree:
    fires: When switching between Claude-managed worktrees mid-session
    can_block: false
    added: v2.1.157
    use: Per-worktree context setup, environment switching

  MessageDisplay:
    fires: Before assistant message is displayed to user
    can_block: false
    added: v2.1.152
    use: Transform or filter assistant messages before display

  SessionStart:
    fires: On session start
    can_block: false
    output: "reloadSkills: true, sessionTitle: string"
    use: Set session title, trigger skill reload, run startup checks

  hook_invoke_types:
    - type: shell
    - type: mcp_tool
    - type: http

# ─── SETTINGS ──────────────────────────────────────────────────────────────────
# Place in .claude/settings.json (project) or ~/.claude/settings.json (user)
settings:
  skillOverrides:
    type: "off | user-invocable-only | name-only"
    desc: "off=hidden from model+slash, user-invocable-only=hidden from model, name-only=minimal exposure"
    added: v2.1.126

  autoScrollEnabled:
    type: bool
    desc: Disable auto-scroll in fullscreen TUI mode
    added: v2.1.100

  showThinkingSummaries:
    type: bool
    default: false
    desc: Control thinking summary generation in responses
    added: v2.1.95

  disableSkillShellExecution:
    type: bool
    desc: Disable inline shell execution within skill definitions
    added: v2.1.98

  prUrlTemplate:
    type: string
    desc: Custom URL template for PR footer badge
    added: v2.1.101

  sandbox.network.deniedDomains:
    type: "list[string]"
    desc: Block specific domains even when broader allowlists exist
    added: v2.1.85

  fallbackModel:
    type: string
    desc: Fallback model(s) when primary unavailable; up to 3 backups supported
    added: v2.1.166

  requiredMinimumVersion:
    type: string
    desc: Enforce minimum Claude Code version for this project
    added: v2.1.163

  requiredMaximumVersion:
    type: string
    desc: Enforce maximum Claude Code version for this project
    added: v2.1.163

  worktree.bgIsolation:
    type: '"none" | default'
    desc: '"none" = background sessions edit working copy directly'
    added: v2.1.143

  worktree.baseRef:
    type: '"fresh" | "head"'
    default: fresh
    desc: Base reference for new worktrees (default changed to fresh)
    added: v2.1.133

  sandbox.bwrapPath:
    type: string
    desc: Custom path for bwrap binary (Linux/WSL managed setting)
    added: v2.1.133

  sandbox.socatPath:
    type: string
    desc: Custom path for socat binary (Linux/WSL managed setting)
    added: v2.1.133

  parentSettingsBehavior:
    type: '"first-wins" | "merge"'
    desc: Admin SDK settings merging strategy
    added: v2.1.133

  autoMode.hard_deny:
    type: "list[string]"
    desc: Unconditional auto mode blocks (not overridable by allow rules)
    added: v2.1.136

  pluginSuggestionMarketplaces:
    type: "list[string]"
    desc: Org-allowlisted plugin marketplaces for /plugin Browse/Discover
    added: v2.1.152

  allowAllClaudeAiMcps:
    type: bool
    desc: Load all claude.ai MCP connectors (enterprise)
    added: v2.1.149

  skipLfs:
    type: bool
    desc: Skip LFS when fetching from GitHub/Git plugin marketplace sources
    added: v2.1.153

# ─── ENV VARS ──────────────────────────────────────────────────────────────────
env:
  CLAUDE_EFFORT: "Current effort level; usable in skill template strings as ${CLAUDE_EFFORT}"
  CLAUDE_CODE_NO_FLICKER: "1 = enable alt-screen flicker-free rendering (same as /tui)"
  CLAUDE_CODE_USE_POWERSHELL_TOOL: "1 = enable PowerShell tool (Windows opt-in preview)"
  CLAUDE_STREAM_IDLE_TIMEOUT_MS: "Integer ms for streaming idle watchdog timeout"
  OTEL_LOG_RAW_API_BODIES: "1 = emit full API request/response bodies as OTEL events"
  DISABLE_UPDATES: "1 = block all update paths including manual 'claude update'"
  CLAUDE_CODE_ENABLE_GATEWAY_MODEL_DISCOVERY: "1 = opt-in gateway /v1/models discovery"
  MAX_THINKING_TOKENS: "0=disable thinking; integer=cap tokens; --thinking disabled flag also works (v2.1.166)"
  OTEL_RESOURCE_ATTRIBUTES: "Custom resource attributes included as metric labels (v2.1.161)"
  CLAUDE_CODE_ENABLE_AUTO_MODE: "1 = enable auto mode on Bedrock/Vertex/Foundry for Opus 4.7/4.8 (v2.1.158)"
  OTEL_LOG_TOOL_DETAILS: "1 = emit tool_parameters in tool_decision OTEL events (v2.1.157)"
  CLAUDE_CODE_SHELL_PREFIX: "Shell prefix for MCP stdio servers (v2.1.147)"
  CLAUDE_CODE_PLUGIN_PREFER_HTTPS: "1 = prefer HTTPS for plugin sources (v2.1.141)"
  ANTHROPIC_WORKSPACE_ID: "Workspace ID for workload identity (v2.1.141)"
  CLAUDE_PROJECT_DIR: "Injected into MCP stdio server environment (v2.1.139)"
  CLAUDE_CODE_SESSION_ID: "Session ID available in Bash subprocesses (v2.1.132)"
  CLAUDE_CODE_DISABLE_ALTERNATE_SCREEN: "1 = opt out of fullscreen alt-screen mode (v2.1.132)"
  CLAUDE_CODE_POWERSHELL_RESPECT_EXECUTION_POLICY: "1 = respect PS execution policy; default is bypass (v2.1.143)"

# ─── MODELS ────────────────────────────────────────────────────────────────────
models:
  default: claude-sonnet-4-6
  opus: claude-opus-4-8        # Latest; high effort default; fast mode uses 4.7
  sonnet: claude-sonnet-4-6
  haiku: claude-haiku-4-5-20251001

