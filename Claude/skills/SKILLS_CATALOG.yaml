  brand-guidelines:
    cmd: /brand-guidelines
    trigger: Anthropic brand look-and-feel needed on an artifact
    desc: Anthropic brand colors/typography

  xlsx:
    cmd: /xlsx
    trigger: spreadsheet (.xlsx/.csv/.tsv) is primary input or output
