# Claude Code Skills Catalog (compact). Source: anthropics/claude-code CHANGELOG
version: 2.1.317
updated: 2026-11-03
# fmt: name: cmd | trigger | desc
skills:
  init: {cmd: /init, trig: init/document codebase, desc: Generate CLAUDE.md; AGENTS.md read if none}
  review: {cmd: /review, trig: review PR/branch, desc: Multi-pass PR review}
  code-review: {cmd: "/code-review [low|medium|high|xhigh|max] [--comment|--fix]", trig: review diff/PR for bugs, desc: Effort-leveled bug review}
  security-review: {cmd: /security-review, trig: security audit of branch diff, desc: OWASP-focused risk-ranked findings}
  simplify: {cmd: /simplify, trig: clean up changed code, desc: Reuse/quality/efficiency fixes}
  session-start-hook: {cmd: /session-start-hook, trig: tests/lint on session start, desc: Create SessionStart hook}
  update-config: {cmd: /update-config, trig: automated behaviors/permissions/env, desc: Edit settings.json hooks/perms/env}
  keybindings-help: {cmd: /keybindings-help, trig: remap keys, desc: Edit ~/.claude/keybindings.json (chords)}
  fewer-permission-prompts: {cmd: /fewer-permission-prompts, trig: fewer dialogs, desc: Add read-only allowlist}
  loop: {cmd: "/loop [interval] [cmd]", trig: recurring task, desc: Repeat prompt/command; no interval=self-paced}
  claude-api: {cmd: "/claude-api [api-version|upgrade|cost-optimize|managed-agents-onboard|managed-agents-secure]", trig: anthropic SDK/API work, desc: Build/debug/migrate API apps; cost profiling; OTEL tracing}
  dataviz: {cmd: /dataviz, trig: chart/dashboard, desc: Chart design guide + palette validator}
  run: {cmd: /run, trig: launch app to verify change, desc: Run/drive project app}
  ultrareview: {cmd: "/ultrareview [PR#]", trig: multi-agent review, desc: Cloud parallel review - billed, git 2.31+}
  ultraplan: {cmd: /ultraplan, trig: complex planning, desc: Cloud multi-agent planning}
  skill-doctor: {cmd: /skill-doctor, trig: prune skills, desc: Show unused skills + context cost}
  reload-skills: {cmd: /reload-skills, trig: skills changed, desc: Rescan skill dirs; sends only new/changed after compaction}
  goal: {cmd: /goal, trig: work until condition met, desc: Keep working across turns until condition}
  auto-mode-setup: {cmd: /auto-mode-setup, trig: tune auto mode, desc: Guided auto-mode env setup}
  doctor: {cmd: "/doctor [prompt-audit]", trig: diagnose config, desc: Config checks; prompt-audit flags old-model prompting; CLAUDE.md trim}
  config: {cmd: "/config key=value", trig: change setting, desc: Set any setting inline; --help lists keys}
  effort: {cmd: /effort, trig: effort level, desc: Per-model slider; s=session only}
  advisor: {cmd: "/advisor [model|off]", trig: advisor model, desc: Pick/disable advisor}
  usage: {cmd: /usage, trig: tokens/cost, desc: Usage/cost; warns max effort, workflows, large results}
  output-style: {cmd: "/output-style [name]", trig: change style, desc: List/switch styles}
  cd: {cmd: /cd, trig: change workdir, desc: Move session cwd, cache kept}
  plugin: {cmd: "/plugin [list|install <p> --marketplace <src>]", trig: manage plugins, desc: Plugin mgmt}
  mcp: {cmd: "/mcp [reconnect all]", trig: MCP status, desc: Manage/reconnect MCP servers}
  diff: {cmd: /diff, trig: see changes, desc: Fullscreen diff panel}
  focus: {cmd: /focus, trig: compact view, desc: Prompt+summary+response only}
  undo: {cmd: /undo, trig: undo, desc: Alias /rewind (can resume pre-/clear)}
  others: {cmd: "/team-onboarding /powerup /tui /theme /color /scroll-speed /usage-credits /rate-limit-options /btw /workflows /schedule /insights /design-sync", desc: See --help}
hooks:  # block: exit 2 | {decision:block}; types: shell, mcp_tool, http
  blockable: [PreToolUse, PreCompact, PreModelSwitch]
  events: [PostToolUse, Notification, Stop, SubagentStop, TaskCreated, WorktreeCreate, PermissionDenied(retry:true), PostModelSwitch, DirectoryAdded, MessageDisplay]
  opts: {PostToolUse.continueOnBlock: "true feeds rejection back to Claude"}
settings:
  skillOverrides: "off|user-invocable-only|name-only"
  disableSkillShellExecution: bool
  idleCompaction: "false disables"
  showThinkingSummaries: bool
  prUrlTemplate: string
  sandbox.network.deniedDomains: list
  forceLoginMethod: gateway
env:
  CLAUDE_EFFORT: "${CLAUDE_EFFORT} in skills"
  CLAUDE_CODE_EFFORT_LEVEL: effort override
  CLAUDE_CODE_NO_FLICKER: 1=alt-screen
  CLAUDE_CODE_SUBAGENT_MODEL: subagent model
  CLAUDE_CODE_IDLE_COMPACT_MIN_TOKENS: idle compaction min (def 200K)
  CLAUDE_CODE_DISABLE_ADVISOR_TOOL: 1=off
  CLAUDE_CODE_MAX_RETRIES: retries
  CLAUDE_CODE_RESUME_INTERRUPTED_TURN: resume cut turn
  CLAUDE_CODE_MCP_STARTUP_WAIT_MS: MCP wait
  CLAUDE_STREAM_IDLE_TIMEOUT_MS: stream watchdog
  DISABLE_UPDATES: 1=block updates
models: {fable: claude-fable-5-1, opus: claude-opus-5-5, sonnet: claude-sonnet-5-5, haiku: claude-haiku-5-5}  # fast mode: Opus 5/4.8
removed: [/agents wizard (edit .claude/agents/), fast-mode Opus 4.7, Default teammate model setting]
