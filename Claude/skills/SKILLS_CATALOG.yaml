    cmd: /loop [interval] [/command]
    trigger: user wants recurring task (e.g. "check every 5m", "keep running X")
    desc: Run prompt or slash command on recurring interval (default 10m)
    example: "/loop 5m /code-review"

  claude-api:
    cmd: /claude-api
    trigger: code imports anthropic SDK; user asks about Claude API features
    desc: Build/debug Claude API apps; prompt caching, tool use, model migration

  run:
    cmd: /run
    trigger: user wants to run/screenshot the app or confirm a change works
    desc: Launch and drive the project app; falls back to per-project-type patterns

  skill-creator:
    cmd: /skill-creator
    trigger: user wants to create, edit, or optimize a skill
    desc: Create new skills, modify existing ones, run evals/benchmarks

  mcp-builder:
    cmd: /mcp-builder
    trigger: user is building an MCP server
    desc: Guide for high-quality MCP servers (Python FastMCP / Node TS SDK)

  dataviz:
    cmd: /dataviz
    trigger: any chart, graph, plot, dashboard, or data visualization
