# Claude Code Skills Catalog
# Source: anthropics/claude-code (public)
# Maintained: yeongam/Prompt-Guide (auto-updated daily 00:00 UTC)
version: 2.1.185
updated: 2026-06-21

# ─── SKILLS ────────────────────────────────────────────────────────────────────
# Format: cmd | trigger | desc
skills:
  init:
    cmd: /init
    trigger: user asks to initialize or document codebase
    desc: Generate CLAUDE.md with codebase architecture, conventions, commands

  review:
    cmd: /review
    trigger: user asks to review PR or branch
    desc: Multi-pass PR review; checks logic, style, security, tests

  code-review:
    cmd: /code-review [--effort low|medium|high|max] [--comment] [--fix]
    trigger: user asks to review changed code or clean up/refactor
    desc: Review diff for bugs + reuse/simplification/efficiency; --comment=inline GitHub; --fix=auto-apply
    note: Renamed from /simplify in v2.1.147; --fix added v2.1.152

  simplify:
    cmd: /simplify
    trigger: user asks to clean up changed code (quality only, not bug hunting)
    desc: Cleanup-only review — reuse, simplification, efficiency, altitude fixes

  security-review:
    cmd: /security-review
    trigger: user asks security audit of current branch changes
    desc: OWASP-focused audit of pending diffs; outputs risk-ranked findings

  session-start-hook:
    cmd: /session-start-hook
    trigger: user wants test/lint runners on session start (web Claude Code)
    desc: Create SessionStart hook ensuring project can run tests and linters

  update-config:
    cmd: /update-config
    trigger: automated behavior requests ("when X", "allow Y", "set Z=val")
    desc: Configure settings.json; handles hooks, permissions, env vars

  keybindings-help:
    cmd: /keybindings-help
    trigger: user wants to remap keys or add chord shortcuts
    desc: Customize ~/.claude/keybindings.json; supports chord bindings

  fewer-permission-prompts:
    cmd: /fewer-permission-prompts
    trigger: user wants fewer permission dialogs
    desc: Scan transcripts → add bash/MCP allowlist to .claude/settings.json

  loop:
    cmd: /loop [interval] [/command]
    trigger: user wants recurring task (e.g. "check every 5m", "keep running X")
    desc: Run prompt or slash command on recurring interval (default 10m)
    example: "/loop 5m /review"

  goal:
    cmd: /goal
    trigger: user wants Claude to keep working autonomously toward a target state
    desc: Set completion condition; Claude works until condition met
    added: v2.1.139

  claude-api:
    cmd: /claude-api
    trigger: code imports anthropic SDK; user asks about Claude API features
    desc: Build/debug Claude API apps; prompt caching, tool use, model migration
    models:
      fable: claude-fable-5
      opus: claude-opus-4-8
      sonnet: claude-sonnet-4-6
      haiku: claude-haiku-4-5-20251001

  run:
    cmd: /run
    trigger: user asks to run, start, or screenshot the app; confirm change in real app
    desc: Launch and drive app (infers from project type; use /run-skill-generator for custom recipe)
    requires: v2.1.145

  verify:
    cmd: /verify
    trigger: user asks to confirm a fix works or validate a change without falling back to tests
    desc: Build + run app to confirm change; no fallback to unit tests or type checks
    requires: v2.1.145

  run-skill-generator:
    cmd: /run-skill-generator
    trigger: project has non-standard build/launch (needs DB, env file, multi-step build)
    desc: Record build+launch recipe once → saves to .claude/skills/run-<name>/SKILL.md
    requires: v2.1.145

  workflows:
    cmd: /workflows
    trigger: user wants to view or manage multi-agent workflow runs
    desc: List and inspect dynamic workflow runs
    added: v2.1.154

  reload-skills:
    cmd: /reload-skills
    trigger: user added or edited skill files in active session
    desc: Re-scan skill directories without restarting
    added: v2.1.152

  cd:
    cmd: /cd <path>
    trigger: user wants to change working directory during session
    desc: Move session to new directory without breaking prompt cache
    added: v2.1.169

  config:
    cmd: /config [key=value] [--help]
    trigger: user wants to change a setting inline
    desc: Set any setting from prompt (e.g. /config thinking=false); --help lists keys
    added: v2.1.181

  plugin:
    cmd: /plugin list [--enabled|--disabled] | details <name> | browse | discover
    trigger: user wants to manage, inspect, or install plugins
    desc: Plugin management; details shows components+token cost; browse/discover shows marketplace
    added: v2.1.163

  scroll-speed:
    cmd: /scroll-speed
    trigger: user wants to adjust mouse wheel scroll speed in TUI
    desc: Tune scroll speed with live preview
    added: v2.1.139

  ultrareview:
    cmd: /ultrareview [PR#]
    trigger: user says "ultrareview" or wants multi-agent review
    desc: Parallel multi-agent cloud code review; no-arg=local branch, arg=GitHub PR
    note: Billed; requires git repo

  ultraplan:
    cmd: /ultraplan
    trigger: user wants cloud environment for complex planning
    desc: Auto-create cloud worktrees/environments for multi-agent planning tasks

  team-onboarding:
    cmd: /team-onboarding
    trigger: user wants teammate ramp-up guide
    desc: Generate onboarding guide from local Claude Code usage history/data

  effort:
    cmd: /effort
    trigger: user wants to adjust effort/quality level (Faster ↔ Smarter)
    desc: Interactive slider for session effort level (also: CLAUDE_EFFORT env var)
    note: Slider labels changed to "Faster"/"Smarter" in v2.1.154

  powerup:
    cmd: /powerup
    trigger: user wants feature demos or to learn Claude Code features
    desc: Interactive animated feature demos with lessons

  tui:
    cmd: /tui
    trigger: rendering looks flickery or user wants full-screen mode
    desc: Switch to flicker-free alt-screen TUI rendering (also: CLAUDE_CODE_NO_FLICKER)

  focus:
    cmd: /focus
    trigger: user wants compact view of conversation
    desc: Toggle focus view showing only: prompt + tool summary + final response

  undo:
    cmd: /undo
    trigger: user wants to undo last action
    desc: Alias for /rewind; undoes last assistant action

  usage:
    cmd: /usage
    trigger: user asks about token or cost statistics
    desc: Show token usage and cost stats per-category (skills, subagents, plugins, MCP)
    note: Per-category breakdown added v2.1.149

  theme:
    cmd: /theme [name]
    trigger: user wants to change or create visual theme
    desc: Create or switch custom color themes

  color:
    cmd: /color
    trigger: user wants a session color
    desc: Set random session color (no args = random pick)

  deep-research:
    cmd: /deep-research
    trigger: user wants multi-source fact-checked research report
    desc: Fan-out web searches, fetch sources, verify claims, synthesize cited report

# ─── HOOKS ─────────────────────────────────────────────────────────────────────
hooks:
  PreToolUse:
    fires: Before any tool execution
    can_block: true
    use: Validate/log before bash/file ops; inject context

  PostToolUse:
    fires: After tool completes
    can_block: false
    continueOnBlock: "true = feed rejection to Claude instead of halting (v2.1.139)"
    use: Log results, trigger follow-up actions

  Notification:
    fires: On push-notification events
    can_block: false
    use: Forward alerts to mobile/Slack

  Stop:
    fires: After assistant turn completes
    can_block: false
    new_fields: [background_tasks, session_crons]
    use: Post-turn logging, notifications, scheduled sub-tasks

  SubagentStop:
    fires: After subagent turn completes
    can_block: false
    new_fields: [background_tasks, session_crons]
    use: Subagent result aggregation

  PreCompact:
    fires: Before conversation compaction
    can_block: true
    block_method: "exit 2 OR {decision:'block'}"
    added: v2.1.85
    use: Prevent compaction during critical operations

  TaskCreated:
    fires: When task created via TaskCreate tool
    can_block: false
    added: v2.1.90
    use: Log/track task creation events

  WorktreeCreate:
    fires: On worktree creation
    can_block: false
    added: v2.1.88
    type_http: returns hookSpecificOutput.worktreePath
    use: Custom worktree provisioning via HTTP endpoint

  PermissionDenied:
    fires: After auto-mode classifier denial
    can_block: false
    retry: "return {retry:true} to re-run classifier"
    added: v2.1.95
    use: Custom permission escalation flows

  SessionStart:
    fires: On session start
    can_block: false
    return_fields:
      reloadSkills: "true = re-scan skill dirs; makes hook-installed skills available immediately"
      hookSpecificOutput.sessionTitle: "Set initial session title"
    added: v2.1.152
    use: Install skills dynamically, set session context

  MessageDisplay:
    fires: When assistant message text is about to display
    can_block: false
    added: v2.1.152
    use: Transform or hide assistant message text before display

  post-session:
    fires: After session ends, before workspace deleted
    can_block: false
    added: v2.1.169
    use: Post-session cleanup, archival, notifications

  hook_invoke_types:
    - type: shell          # shell command (default)
    - type: mcp_tool       # invoke MCP tool directly (v2.1.118)
    - type: http           # HTTP endpoint (WorktreeCreate only)

  hook_exec_form:
    field: "args: string[]"
    desc: Spawn directly without shell (added v2.1.139)

  hook_output_fields:
    terminalSequence: "Emit desktop notifications, window titles, bells (v2.1.141)"

# ─── SETTINGS ──────────────────────────────────────────────────────────────────
settings:
  disableBundledSkills:
    type: bool
    desc: Disable all bundled skills (also CLAUDE_CODE_DISABLE_BUNDLED_SKILLS)
    added: v2.1.169

  fallbackModel:
    type: "string | list[string] (max 3)"
    desc: Fallback model(s) tried in order when primary unavailable
    added: v2.1.166

  worktree.bgIsolation:
    type: "none | default"
    desc: "none = background sessions edit working copy directly"
    added: v2.1.143

  language:
    type: string
    desc: Pin language for session title generation
    added: v2.1.176

  footerLinksRegexes:
    type: "list[string]"
    desc: Regex-matched link badges in footer
    added: v2.1.176

  attribution.sessionUrl:
    type: bool
    desc: Omit claude.ai session link from commits/PRs (web/Remote Control sessions)
    added: v2.1.183

  sandbox.allowAppleEvents:
    type: bool
    desc: Opt-in to Apple Events on macOS
    added: v2.1.181

  wheelScrollAccelerationEnabled:
    type: bool
    desc: Disable mouse-wheel scroll acceleration in fullscreen TUI
    added: v2.1.174

  skillOverrides:
    type: "off | user-invocable-only | name-only"
    desc: "off=hidden from model+slash, user-invocable-only=hidden from model, name-only=minimal"
    added: v2.1.126

  autoScrollEnabled:
    type: bool
    desc: Disable auto-scroll in fullscreen TUI mode
    added: v2.1.100

  showThinkingSummaries:
    type: bool
    default: false
    desc: Control thinking summary generation in responses
    added: v2.1.95

  disableSkillShellExecution:
    type: bool
    desc: Disable inline shell execution within skill definitions
    added: v2.1.98

  prUrlTemplate:
    type: string
    desc: Custom URL template for PR footer badge
    added: v2.1.101

  sandbox.network.deniedDomains:
    type: "list[string]"
    desc: Block specific domains even when broader allowlists exist
    added: v2.1.85

  managed_enforceAvailableModels:
    type: "list[string]"
    desc: Constrain Default model to allowlist; prevents user widening
    added: v2.1.175

  managed_requiredMinimumVersion:
    type: string
    desc: Claude Code refuses to start if version is older
    added: v2.1.163

  managed_requiredMaximumVersion:
    type: string
    desc: Claude Code refuses to start if version is newer
    added: v2.1.163

  managed_allowAllClaudeAiMcps:
    type: bool
    desc: Load claude.ai cloud MCP connectors alongside managed-mcp.json
    added: v2.1.149

  managed_pluginSuggestionMarketplaces:
    type: "list[string]"
    desc: Allowlist orgs whose plugins may be suggested
    added: v2.1.152

# ─── ENV VARS ──────────────────────────────────────────────────────────────────
env:
  CLAUDE_EFFORT: "Current effort level; usable in skill template strings as ${CLAUDE_EFFORT}"
  CLAUDE_CODE_NO_FLICKER: "1 = enable alt-screen flicker-free rendering (same as /tui)"
  CLAUDE_CODE_USE_POWERSHELL_TOOL: "1 = enable PowerShell tool (Windows opt-in preview)"
  CLAUDE_STREAM_IDLE_TIMEOUT_MS: "Integer ms for streaming idle watchdog timeout"
  OTEL_LOG_RAW_API_BODIES: "1 = emit full API request/response bodies as OTEL events"
  OTEL_LOG_TOOL_DETAILS: "1 = include tool_parameters in OTEL telemetry events"
  OTEL_METRICS_INCLUDE_ENTRYPOINT: "true = add app.entrypoint attribute to metrics"
  DISABLE_UPDATES: "1 = block all update paths including manual 'claude update'"
  CLAUDE_CODE_ENABLE_GATEWAY_MODEL_DISCOVERY: "1 = opt-in gateway /v1/models discovery"
  CLAUDE_CODE_SAFE_MODE: "1 = disable all customizations (skills, hooks, plugins, MCP)"
  CLAUDE_CODE_DISABLE_BUNDLED_SKILLS: "1 = disable all bundled skills"
  CLAUDE_CODE_ALWAYS_ENABLE_EFFORT: "1 = enable effort slider on all models"
  CLAUDE_CODE_ENABLE_AUTO_MODE: "1 = enable auto mode on Bedrock/Vertex/Foundry"
  CLAUDE_CODE_SESSION_ID: "Session ID provided to stdio MCP servers on --resume"
  CLAUDE_CODE_PLUGIN_PREFER_HTTPS: "1 = clone GitHub plugin sources over HTTPS"
  CLAUDECODE: "1 = set in environment of stdio MCP servers"
  ANTHROPIC_WORKSPACE_ID: "Workload identity federation workspace scoping"
  CLAUDE_CLIENT_PRESENCE_FILE: "Path to file; suppresses mobile push while file exists"
  CLAUDE_CODE_ADDITIONAL_DIRECTORIES_CLAUDE_MD: "1 = load CLAUDE.md from --add-dir dirs"
  CLAUDE_CODE_POWERSHELL_RESPECT_EXECUTION_POLICY: "1 = opt out of -ExecutionPolicy Bypass"
  MAX_THINKING_TOKENS: "0 = disable thinking on models that think by default"

# ─── MODELS ────────────────────────────────────────────────────────────────────
models:
  default: claude-sonnet-4-6
  fable: claude-fable-5           # Mythos-class; GA v2.1.170
  opus: claude-opus-4-8           # High effort default; added v2.1.154
  opus_prev: claude-opus-4-7      # Fast mode default (non-4.8 sessions)
  sonnet: claude-sonnet-4-6
  haiku: claude-haiku-4-5-20251001

# ─── SUB-AGENT DEPTH ────────────────────────────────────────────────────────────
sub_agents:
  max_depth: 5   # Sub-agents can now spawn sub-agents up to 5 levels deep (v2.1.172)

# ─── TOKEN OPTIMIZATION NOTES ──────────────────────────────────────────────────
# - One canonical source (this file); date-based delta in skills/YYYY-MM-DD/skills/
# - YAML over JSON/Markdown: ~30% fewer tokens for structured data
# - Descriptions capped at one line; examples only where non-obvious
# - "added:" version tags kept for audit; remove if tokens are critical
