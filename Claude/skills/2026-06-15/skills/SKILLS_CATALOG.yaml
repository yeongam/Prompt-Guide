# Claude Code Skills Catalog
# Source: anthropics/claude-code (public)
# Maintained: yeongam/Prompt-Guide (auto-updated daily 00:00 UTC)
version: 2.1.177
updated: 2026-06-15

# ─── SKILLS ────────────────────────────────────────────────────────────────────
# Format: cmd | trigger | desc
skills:
  init:
    cmd: /init
    trigger: user asks to initialize or document codebase
    desc: Generate CLAUDE.md with codebase architecture, conventions, commands

  review:
    cmd: /review
    trigger: user asks to review PR or branch
    desc: Multi-pass PR review; checks logic, style, security, tests

  security-review:
    cmd: /security-review
    trigger: user asks security audit of current branch changes
    desc: OWASP-focused audit of pending diffs; outputs risk-ranked findings

  code-review:
    cmd: /code-review [--comment|--fix] [low|medium|high|max]
    trigger: user asks to review or clean up changed code
    desc: Multi-effort review for correctness bugs, reuse, efficiency (renamed from /simplify; old name still works)
    added: v2.1.155

  simplify:
    cmd: /simplify
    trigger: alias for /code-review (legacy name, still works)
    desc: Redirects to /code-review for backwards compatibility

  session-start-hook:
    cmd: /session-start-hook
    trigger: user wants test/lint runners on session start (web Claude Code)
    desc: Create SessionStart hook ensuring project can run tests and linters

  update-config:
    cmd: /update-config
    trigger: automated behavior requests ("when X", "allow Y", "set Z=val")
    desc: Configure settings.json; handles hooks, permissions, env vars

  keybindings-help:
    cmd: /keybindings-help
    trigger: user wants to remap keys or add chord shortcuts
    desc: Customize ~/.claude/keybindings.json; supports chord bindings

  fewer-permission-prompts:
    cmd: /fewer-permission-prompts
    trigger: user wants fewer permission dialogs
    desc: Scan transcripts → add bash/MCP allowlist to .claude/settings.json

  loop:
    cmd: /loop [interval] [/command]
    trigger: user wants recurring task (e.g. "check every 5m", "keep running X")
    desc: Run prompt or slash command on recurring interval (default 10m)
    example: "/loop 5m /review"
    note: Not promoted in remote sessions (v2.1.154+)

  claude-api:
    cmd: /claude-api
    trigger: code imports anthropic SDK; user asks about Claude API features
    desc: Build/debug Claude API apps; prompt caching, tool use, model migration
    models:
      opus: claude-opus-4-8
      sonnet: claude-sonnet-4-6
      haiku: claude-haiku-4-5-20251001

  goal:
    cmd: /goal <condition>
    trigger: user wants Claude to keep working until a condition is met
    desc: Set completion condition; loops with live elapsed/turns/tokens overlay panel
    added: v2.1.139

  scroll-speed:
    cmd: /scroll-speed
    trigger: scroll feels too fast or too slow
    desc: Tune mouse wheel scroll speed with live preview
    added: v2.1.139

  cd:
    cmd: /cd <path>
    trigger: user wants to move session to a different working directory
    desc: Move session to new working directory without breaking prompt cache
    added: v2.1.157

  terminal-setup:
    cmd: /terminal-setup
    trigger: user wants to configure terminal or GPU acceleration
    desc: Configure terminal settings (GPU acceleration, rendering, etc.)
    added: v2.1.160

  workflows:
    cmd: /workflows
    trigger: user wants to view dynamic workflow runs; keyword "ultracode"
    desc: View and manage dynamic workflow runs
    added: v2.1.169

  reload-skills:
    cmd: /reload-skills
    trigger: user updated skill files and wants them reloaded without restart
    desc: Re-scan skill directories mid-session
    added: v2.1.152

  plugin-list:
    cmd: /plugin list [--enabled|--disabled]
    trigger: user wants to see installed plugins
    desc: List installed plugins with optional enabled/disabled filter
    added: v2.1.162

  ultrareview:
    cmd: /ultrareview [PR#]
    trigger: user says "ultrareview" or wants multi-agent review
    desc: Parallel multi-agent cloud code review; no-arg=local branch, arg=GitHub PR
    note: Billed; requires git repo

  ultraplan:
    cmd: /ultraplan
    trigger: user wants cloud environment for complex planning
    desc: Auto-create cloud worktrees/environments for multi-agent planning tasks

  team-onboarding:
    cmd: /team-onboarding
    trigger: user wants teammate ramp-up guide
    desc: Generate onboarding guide from local Claude Code usage history/data

  effort:
    cmd: /effort
    trigger: user wants to adjust effort/quality level
    desc: Interactive slider for session effort level (also: CLAUDE_EFFORT env var)

  powerup:
    cmd: /powerup
    trigger: user wants feature demos or to learn Claude Code features
    desc: Interactive animated feature demos with lessons

  tui:
    cmd: /tui
    trigger: rendering looks flickery or user wants full-screen mode
    desc: Switch to flicker-free alt-screen TUI rendering (also: CLAUDE_CODE_NO_FLICKER)

  focus:
    cmd: /focus
    trigger: user wants compact view of conversation
    desc: Toggle focus view showing only: prompt + tool summary + final response

  undo:
    cmd: /undo
    trigger: user wants to undo last action
    desc: Alias for /rewind; undoes last assistant action

  usage:
    cmd: /usage
    trigger: user asks about token or cost statistics
    desc: Show token usage and cost stats (merged /cost + /stats)

  theme:
    cmd: /theme [name]
    trigger: user wants to change or create visual theme
    desc: Create or switch custom color themes

  color:
    cmd: /color
    trigger: user wants a session color
    desc: Set random session color (no args = random pick)

# ─── HOOKS ─────────────────────────────────────────────────────────────────────
# Block: exit 2 OR return JSON {decision:"block", reason:"..."}
# Retry: return JSON {retry:true} (PermissionDenied only)
hooks:
  PreToolUse:
    fires: Before any tool execution
    can_block: true
    use: Validate/log before bash/file ops; inject context

  PostToolUse:
    fires: After tool completes
    can_block: false
    options:
      continueOnBlock: Feed rejection reasons back to Claude and continue turn (v2.1.139)
    use: Log results, trigger follow-up actions

  Notification:
    fires: On push-notification events
    can_block: false
    use: Forward alerts to mobile/Slack (requires Remote Control setup)

  Stop:
    fires: After assistant turn completes
    can_block: false
    output: "hookSpecificOutput.additionalContext → give Claude feedback and continue turn (v2.1.152)"
    use: Post-turn logging, notifications

  SubagentStop:
    fires: After subagent turn completes
    can_block: false
    output: "hookSpecificOutput.additionalContext → subagent feedback (v2.1.152)"
    use: Subagent result aggregation

  PreCompact:
    fires: Before conversation compaction
    can_block: true
    block_method: "exit 2 OR {decision:'block'}"
    added: v2.1.85
    use: Prevent compaction during critical operations

  MessageDisplay:
    fires: When assistant message text is about to be displayed
    can_block: false
    added: v2.1.152
    use: Transform or hide assistant message text before display

  TaskCreated:
    fires: When task created via TaskCreate tool
    can_block: false
    added: v2.1.90
    use: Log/track task creation events

  WorktreeCreate:
    fires: On worktree creation
    can_block: false
    added: v2.1.88
    type_http: returns hookSpecificOutput.worktreePath
    use: Custom worktree provisioning via HTTP endpoint

  PermissionDenied:
    fires: After auto-mode classifier denial
    can_block: false
    retry: "return {retry:true} to re-run classifier"
    added: v2.1.95
    use: Custom permission escalation flows

  SessionStart:
    fires: On session initialization
    can_block: false
    output:
      reloadSkills: "true → re-scan skill directories mid-session (v2.1.152)"
      sessionTitle: "Set session title string (v2.1.152)"
    use: Init context, inject session metadata

  post-session:
    fires: After session ends, before workspace deletion
    can_block: false
    added: v2.1.169
    note: Self-hosted runner only
    use: Cleanup, archival, post-session reporting

  hook_invoke_types:
    - type: shell          # default
    - type: mcp_tool       # invoke MCP tool directly (v2.1.118)
    - type: http           # HTTP endpoint (WorktreeCreate)
  hook_common_fields:
    args: "string[] — exec form; direct spawn without shell (v2.1.152)"

# ─── SETTINGS ──────────────────────────────────────────────────────────────────
# Place in .claude/settings.json (project) or ~/.claude/settings.json (user)
settings:
  skillOverrides:
    type: "off | user-invocable-only | name-only"
    desc: "off=hidden from model+slash; user-invocable-only=hidden from model; name-only=minimal exposure"
    added: v2.1.126

  disableBundledSkills:
    type: bool
    desc: Hide bundled skills, workflows, and built-in slash commands
    added: v2.1.139

  autoScrollEnabled:
    type: bool
    desc: Disable auto-scroll in fullscreen TUI mode
    added: v2.1.100

  showThinkingSummaries:
    type: bool
    default: false
    desc: Control thinking summary generation in responses
    added: v2.1.95

  disableSkillShellExecution:
    type: bool
    desc: Disable inline shell execution within skill definitions
    added: v2.1.98

  prUrlTemplate:
    type: string
    desc: Custom URL template for PR footer badge
    added: v2.1.101

  "sandbox.network.deniedDomains":
    type: "list[string]"
    desc: Block specific domains even when broader allowlists exist
    added: v2.1.85

  "sandbox.bwrapPath":
    type: string
    desc: Custom bubblewrap binary location (Linux/WSL)
    added: v2.1.133

  "sandbox.socatPath":
    type: string
    desc: Custom socat binary location (Linux/WSL)
    added: v2.1.133

  "worktree.baseRef":
    type: "'fresh' | 'head'"
    desc: "Worktrees branch from origin/<default> ('fresh') or local HEAD ('head')"
    added: v2.1.133

  "worktree.bgIsolation":
    type: "'worktree' | 'none'"
    desc: Background sessions isolate to worktree or edit working copy directly
    added: v2.1.143

  "settings.autoMode.hard_deny":
    type: object
    desc: Auto mode classifier rules that block unconditionally
    added: v2.1.136

  enforceAvailableModels:
    type: bool
    desc: Constrain Default model to availableModels allowlist
    added: v2.1.146

  requiredMinimumVersion:
    type: string
    desc: Refuse to start if version is below this (managed setting)
    added: v2.1.163

  requiredMaximumVersion:
    type: string
    desc: Refuse to start if version is above this (managed setting)
    added: v2.1.163

  footerLinksRegexes:
    type: object
    desc: Regex-matched link badges in footer row (user or managed settings)
    added: v2.1.165

  language:
    type: string
    desc: Pin conversation language for session title generation
    added: v2.1.176

# ─── ENV VARS ──────────────────────────────────────────────────────────────────
env:
  CLAUDE_EFFORT: "Active effort level; usable in skill templates as ${CLAUDE_EFFORT}"
  CLAUDE_CODE_NO_FLICKER: "1 = enable alt-screen flicker-free rendering (same as /tui)"
  CLAUDE_CODE_USE_POWERSHELL_TOOL: "1 = enable PowerShell tool (Windows opt-in preview)"
  CLAUDE_STREAM_IDLE_TIMEOUT_MS: "Integer ms for streaming idle watchdog timeout"
  OTEL_LOG_RAW_API_BODIES: "1 = emit full API request/response bodies as OTEL events"
  DISABLE_UPDATES: "1 = block all update paths including manual 'claude update'"
  CLAUDE_CODE_ENABLE_GATEWAY_MODEL_DISCOVERY: "1 = opt-in gateway /v1/models discovery"
  ANTHROPIC_WORKSPACE_ID: "Scope minted token to specific workspace (workload identity federation) (v2.1.141)"
  CLAUDE_CODE_ALWAYS_ENABLE_EFFORT: "Enable effort param on models that don't natively support it (v2.1.152)"
  CLAUDE_CODE_DISABLE_BUNDLED_SKILLS: "Disable bundled skills, workflows, built-in slash commands (v2.1.154)"
  CLAUDE_CODE_PLUGIN_PREFER_HTTPS: "Clone GitHub plugin sources over HTTPS instead of SSH (v2.1.157)"
  CLAUDE_CODE_POWERSHELL_RESPECT_EXECUTION_POLICY: "Don't bypass PowerShell execution policy (v2.1.160)"
  CLAUDE_CODE_SAFE_MODE: "Start with all customizations disabled for troubleshooting (v2.1.163)"
  CLAUDE_CODE_SESSION_ID: "Passed to stdio MCP servers and hooks; matches current session ID (v2.1.169)"
  CLAUDE_MEMORY_STORES: "Team memory store mounts for remote sessions (v2.1.172)"
  "API_FORCE_IDLE_TIMEOUT=0": "Disable 5-minute idle timeout for Vertex/Foundry (v2.1.176)"

# ─── MODELS ────────────────────────────────────────────────────────────────────
models:
  default: claude-sonnet-4-6
  opus: claude-opus-4-8        # Default model (v2.1.154+); Fast mode available; Max subscribers
  sonnet: claude-sonnet-4-6
  haiku: claude-haiku-4-5-20251001

# ─── TOKEN OPTIMIZATION NOTES ──────────────────────────────────────────────────
# Structured for minimal token overhead:
# - YAML over JSON/Markdown: ~30% fewer tokens for structured data
# - Descriptions capped at one line; examples only where non-obvious
# - Version tags kept for audit; remove if tokens are critical
# - Removed deprecated CLAUDE_CODE_OPUS_4_6_FAST_MODE_OVERRIDE (sunset 2026-06-01)
