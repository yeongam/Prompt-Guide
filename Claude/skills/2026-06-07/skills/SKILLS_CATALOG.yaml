# Claude Code Skills Catalog
# Source: anthropics/claude-code (public)
# Maintained: yeongam/Prompt-Guide (auto-updated daily 00:00 UTC)
version: 2.1.153
updated: 2026-06-07

# ─── SKILLS ────────────────────────────────────────────────────────────────────
skills:
  init:
    cmd: /init
    trigger: user asks to initialize or document codebase
    desc: Generate CLAUDE.md with codebase architecture, conventions, commands

  review:
    cmd: /review
    trigger: user asks to review PR or branch
    desc: Multi-pass PR review; checks logic, style, security, tests

  security-review:
    cmd: /security-review
    trigger: user asks security audit of current branch changes
    desc: OWASP-focused audit of pending diffs; outputs risk-ranked findings

  simplify:
    cmd: /simplify
    trigger: user asks to clean up or refactor changed code
    desc: Cleanup-only review of changed code; applies fixes automatically
    updated: v2.1.136

  session-start-hook:
    cmd: /session-start-hook
    trigger: user wants test/lint runners on session start (web Claude Code)
    desc: Create SessionStart hook ensuring project can run tests and linters

  update-config:
    cmd: /update-config
    trigger: automated behavior requests ("when X", "allow Y", "set Z=val")
    desc: Configure settings.json; handles hooks, permissions, env vars

  keybindings-help:
    cmd: /keybindings-help
    trigger: user wants to remap keys or add chord shortcuts
    desc: Customize ~/.claude/keybindings.json; supports chord bindings

  fewer-permission-prompts:
    cmd: /fewer-permission-prompts
    trigger: user wants fewer permission dialogs
    desc: Scan transcripts → add bash/MCP allowlist to .claude/settings.json

  loop:
    cmd: /loop [interval] [/command]
    trigger: user wants recurring task (e.g. "check every 5m", "keep running X")
    desc: Run prompt or slash command on recurring interval (default 10m)
    example: "/loop 5m /review"

  claude-api:
    cmd: /claude-api
    trigger: code imports anthropic SDK; user asks about Claude API features
    desc: Build/debug Claude API apps; prompt caching, tool use, model migration
    models:
      opus: claude-opus-4-8
      sonnet: claude-sonnet-4-6
      haiku: claude-haiku-4-5-20251001

  ultrareview:
    cmd: /ultrareview [PR#]
    trigger: user says "ultrareview" or wants multi-agent review
    desc: Parallel multi-agent cloud code review; no-arg=local branch, arg=GitHub PR
    note: Billed; requires git repo

  ultraplan:
    cmd: /ultraplan
    trigger: user wants cloud environment for complex planning
    desc: Auto-create cloud worktrees/environments for multi-agent planning tasks

  team-onboarding:
    cmd: /team-onboarding
    trigger: user wants teammate ramp-up guide
    desc: Generate onboarding guide from local Claude Code usage history/data

  effort:
    cmd: /effort
    trigger: user wants to adjust effort/quality level
    desc: Interactive slider for session effort level (also: CLAUDE_EFFORT env var)

  powerup:
    cmd: /powerup
    trigger: user wants feature demos or to learn Claude Code features
    desc: Interactive animated feature demos with lessons

  tui:
    cmd: /tui
    trigger: rendering looks flickery or user wants full-screen mode
    desc: Switch to flicker-free alt-screen TUI rendering (also: CLAUDE_CODE_NO_FLICKER)

  focus:
    cmd: /focus
    trigger: user wants compact view of conversation
    desc: Toggle focus view showing only prompt + tool summary + final response

  undo:
    cmd: /undo
    trigger: user wants to undo last action
    desc: Alias for /rewind; undoes last assistant action

  usage:
    cmd: /usage
    trigger: user asks about token or cost statistics
    desc: Show token usage and cost stats (merged /cost + /stats)

  theme:
    cmd: /theme [name]
    trigger: user wants to change or create visual theme
    desc: Create or switch custom color themes

  color:
    cmd: /color
    trigger: user wants a session color
    desc: Set random session color (no args = random pick)

  goal:
    cmd: /goal
    trigger: user wants to set multi-turn completion conditions
    desc: Set completion conditions for Claude to work toward across turns
    added: v2.1.130

  scroll-speed:
    cmd: /scroll-speed
    trigger: user wants to tune mouse wheel scroll speed
    desc: Adjust scroll speed with live preview
    added: v2.1.130

  reload-skills:
    cmd: /reload-skills
    trigger: user wants to reload skills without restarting the session
    desc: Re-scan skill directories mid-session without full restart
    added: v2.1.130

# ─── HOOKS ─────────────────────────────────────────────────────────────────────
# Block: exit 2 OR {decision:"block", reason:"..."}
# Retry: {retry:true} (PermissionDenied only)
hooks:
  PreToolUse:
    fires: Before any tool execution
    can_block: true
    use: Validate/log before bash/file ops; inject context

  PostToolUse:
    fires: After tool completes
    can_block: false
    continueOnBlock: "true = feed rejection reason back to Claude (v2.1.139)"
    use: Log results, trigger follow-up actions

  Notification:
    fires: On push-notification events
    can_block: false
    use: Forward alerts to mobile/Slack

  Stop:
    fires: After assistant turn completes
    can_block: false
    use: Post-turn logging, notifications

  SubagentStop:
    fires: After subagent turn completes
    can_block: false
    use: Subagent result aggregation

  PreCompact:
    fires: Before conversation compaction
    can_block: true
    added: v2.1.85
    use: Prevent compaction during critical operations

  TaskCreated:
    fires: When task created via TaskCreate tool
    can_block: false
    added: v2.1.90
    use: Log/track task creation events

  WorktreeCreate:
    fires: On worktree creation
    can_block: false
    added: v2.1.88
    type_http: returns hookSpecificOutput.worktreePath
    use: Custom worktree provisioning via HTTP endpoint

  PermissionDenied:
    fires: After auto-mode classifier denial
    can_block: false
    retry: "return {retry:true} to re-run classifier"
    added: v2.1.95
    use: Custom permission escalation flows

  MessageDisplay:
    fires: Before assistant message text is shown
    can_block: false
    added: v2.1.140
    use: Transform or suppress assistant message text

  SessionStart:
    fires: At session initialization
    can_block: false
    added: v2.1.140
    hookSpecificOutput:
      reloadSkills: "true = reload skill dirs mid-session"
      sessionTitle: "string = set session window title"
    use: Session setup, title injection, skill reload trigger

  hook_features:
    args_field: "args: string[] exec form; spawns commands directly (v2.1.139)"
    terminal_sequence: "terminalSequence field emits desktop notifications (v2.1.141)"
    disallowed_tools: "skills set disallowed-tools in frontmatter (v2.1.152)"
    default_enabled: "skills declare defaultEnabled: false; enable via /plugin (v2.1.132)"

  hook_invoke_types:
    - type: shell
    - type: mcp_tool
    - type: http

# ─── SETTINGS ──────────────────────────────────────────────────────────────────
settings:
  skillOverrides:
    type: "off | user-invocable-only | name-only"
    desc: Control skill visibility exposure to model and slash commands
    added: v2.1.126

  autoScrollEnabled:
    type: bool
    desc: Disable auto-scroll in fullscreen TUI mode
    added: v2.1.100

  showThinkingSummaries:
    type: bool
    default: false
    desc: Control thinking summary generation
    added: v2.1.95

  disableSkillShellExecution:
    type: bool
    desc: Disable inline shell execution within skill definitions
    added: v2.1.98

  prUrlTemplate:
    type: string
    desc: Custom URL template for PR footer badge
    added: v2.1.101

  sandbox.network.deniedDomains:
    type: "list[string]"
    desc: Block specific domains even with broader allowlists
    added: v2.1.85

  worktree.baseRef:
    type: "fresh | head"
    desc: Base reference for new worktrees
    added: v2.1.131

  sandbox.bwrapPath:
    type: string
    desc: Custom path to bwrap binary
    added: v2.1.131

  sandbox.socatPath:
    type: string
    desc: Custom path to socat binary
    added: v2.1.131

  parentSettingsBehavior:
    type: "first-wins | merge"
    desc: Merge strategy for SDK managedSettings inheritance
    added: v2.1.131

  autoMode.hard_deny:
    type: "list[string]"
    desc: Unconditional auto-mode classifier blocks
    added: v2.1.132

  pluginSuggestionMarketplaces:
    type: "list[string]"
    desc: Allowlist of org marketplaces for plugin suggestions
    added: v2.1.133

  worktree.bgIsolation:
    type: "none"
    desc: '"none" lets background sessions edit working copy directly'
    added: v2.1.143

# ─── ENV VARS ──────────────────────────────────────────────────────────────────
env:
  CLAUDE_EFFORT: "Active effort level; usable in skill templates as ${CLAUDE_EFFORT}"
  CLAUDE_CODE_NO_FLICKER: "1 = alt-screen flicker-free rendering (same as /tui)"
  CLAUDE_CODE_USE_POWERSHELL_TOOL: "1 = enable PowerShell tool (Windows preview)"
  CLAUDE_STREAM_IDLE_TIMEOUT_MS: "Integer ms for streaming idle watchdog timeout"
  OTEL_LOG_RAW_API_BODIES: "1 = emit full API request/response bodies as OTEL events"
  DISABLE_UPDATES: "1 = block all update paths including manual 'claude update'"
  CLAUDE_CODE_ENABLE_GATEWAY_MODEL_DISCOVERY: "1 = opt-in gateway /v1/models discovery"
  CLAUDE_CODE_SESSION_ID: "Unique session ID passed to Bash subprocesses and hooks (v2.1.130)"
  CLAUDE_CODE_DISABLE_ALTERNATE_SCREEN: "1 = opt out of fullscreen renderer (v2.1.131)"
  CLAUDE_CODE_FORCE_SYNC_OUTPUT: "1 = force-enable synchronized output detection (v2.1.131)"
  CLAUDE_CODE_PACKAGE_MANAGER_AUTO_UPDATE: "1 = auto-run upgrade in background (v2.1.131)"
  CLAUDE_CODE_ENABLE_FEEDBACK_SURVEY_FOR_OTEL: "1 = re-enable survey for OTel sessions (v2.1.133)"
  OTEL_METRICS_INCLUDE_ENTRYPOINT: "1 = include session entrypoint as OTel attribute (v2.1.133)"
  CLAUDE_PROJECT_DIR: "Project root provided to MCP stdio servers (v2.1.139)"
  CLAUDE_CODE_SHELL_PREFIX: "Shell prefix for MCP stdio servers (v2.1.153)"

# ─── MODELS ────────────────────────────────────────────────────────────────────
models:
  default: claude-sonnet-4-6
  opus: claude-opus-4-8
  sonnet: claude-sonnet-4-6
  haiku: claude-haiku-4-5-20251001

# ─── TOKEN OPTIMIZATION ────────────────────────────────────────────────────────
# - Single canonical YAML source; no duplication across skills
# - YAML ~30% fewer tokens than equivalent JSON/Markdown
# - One-line descriptions; examples only where non-obvious
# - Inline version tags for audit; strip if token budget is tight
