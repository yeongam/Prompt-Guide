# Claude Code skills catalog | src: anthropics/claude-code | auto-synced daily 00:00 UTC
# fmt: name: "cmd | use when | effect"   (compact; one line each)
version: 2.1.286
updated: 2026-10-01
skills:
  init: "/init | document codebase | write CLAUDE.md"
  review: "/review | review PR/branch | multi-pass logic/style/security/tests"
  security-review: "/security-review | audit branch diff | risk-ranked findings"
  code-review: "/code-review [low|medium|high|xhigh|max] [--comment] [--fix] | correctness review (replaces /simplify scope) | bugs at chosen effort; --comment=inline PR comments"
  simplify: "/simplify | cleanup changed code | reuse/quality/efficiency fixes (quality only)"
  session-start-hook: "/session-start-hook | tests/lint on web session start | create SessionStart hook"
  update-config: "/update-config | automate 'when X'/permissions/env | edit settings.json"
  keybindings-help: "/keybindings-help | remap keys | edit keybindings.json"
  fewer-permission-prompts: "/fewer-permission-prompts | fewer dialogs | add read-only allowlist"
  loop: "/loop [interval] [cmd] | recurring task | run on interval (omit=self-paced)"
  claude-api: "/claude-api [upgrade|cost-optimize|prompt-audit] | Anthropic SDK work | build/debug/migrate (py 0.x->1.x, Opus 4.7->4.8), cut spend, audit prompts"
  skill-doctor: "/skill-doctor | prune skills | show unused skills + context cost"
  dataviz: "/dataviz | charts/dashboards | design guidance + palette validator"
  goal: "/goal <condition> | work until done | keep going across turns until met"
  cd: "/cd <dir> | change workdir | keeps prompt cache"
  reload-skills: "/reload-skills | skills edited | rescan without restart"
  reload-plugins: "/reload-plugins | plugins edited | reload (also headless)"
  doctor: "/doctor [prompt-audit] (alias /checkup) | config issues | diagnose; audit CLAUDE.md/skills for old-model prompt patterns"
  config: "/config key=value | set a setting | works interactive, -p, Remote Control; --help lists keys"
  output-style: "/output-style [name] | switch style | list/switch (incl. headless)"
  scroll-speed: "/scroll-speed | tune wheel | live preview"
  usage-credits: "/usage-credits (old /extra-usage) | billing credits | manage"
  plugin: "/plugin [install <p> --marketplace <src>|list --enabled|--disabled] | plugins | manage; CLI: claude plugin init <name>"
  mcp: "/mcp [reconnect all] | MCP failed/auth | retry all"
  ultrareview: "/ultrareview [PR#] | multi-agent review | cloud; billed; no-arg=local branch"
  ultraplan: "/ultraplan | complex planning | cloud multi-agent"
  team-onboarding: "/team-onboarding | ramp-up guide | from local usage"
  effort: "/effort | quality level | slider Faster/Smarter; ${CLAUDE_EFFORT}"
  tui: "/tui | flicker | alt-screen render"
  focus: "/focus | compact view | prompt+tool summary+result"
  undo: "/undo | revert last action | alias /rewind (can resume pre-/clear)"
  usage: "/usage | tokens/cost | stats (merges /cost,/stats)"
  powerup: "/powerup | learn features | interactive demos"
  theme: "/theme [name] | colors | create/switch"
  color: "/color | session color | random"
removed: [agents-wizard]   # /agents wizard gone: ask Claude or edit .claude/agents/
hooks:   # block: exit 2 | {decision:block,reason} ; types: shell|mcp_tool|http ; hook args:string[] = exec form (no shell)
  PreToolUse: "before tool; can block"
  PostToolUse: "after tool; continueOnBlock:true feeds rejection back"
  Notification: "push events; agent_needs_input/agent_completed"
  Stop: "turn end"
  SubagentStop: "subagent end"
  PreCompact: "before compaction; can block"
  TaskCreated: "task created"
  WorktreeCreate: "worktree created; http returns worktreePath"
  PermissionDenied: "auto-mode denial; {retry:true}"
  PreModelSwitch: "before model switch; block/confirm/annotate"
  PostModelSwitch: "after model switch"
  MessageDisplay: "transform/hide assistant text on display"
  DirectoryAdded: "after /add-dir"
  SessionStart: "resume hooks get staleness + re-cache cost"
  output_field: "terminalSequence = notifications/title/bell without tty"
settings:   # .claude/settings.json (project) | ~/.claude/settings.json (user)
  skillOverrides: "off|user-invocable-only|name-only"
  disableBundledSkills: "bool (+env CLAUDE_CODE_DISABLE_BUNDLED_SKILLS)"
  disableSkillShellExecution: bool
  syncClaudeAiSkills: "bool, default on; also syncClaudeAiPlugins"
  fallbackModel: "<=3 models, tried in order"
  maxEffortLevel: "cap effort"
  promptCacheTtl: "5m|1h; subagentPromptCacheTtl"
  bashOutputMaxChars: "<=128K; taskOutputMaxChars"
  attribution: "false hides all; .sessionUrl omits session link"
  worktree: "baseRef fresh|head; bgIsolation none"
  sandbox: "network.strictAllowlist, network.deniedDomains, credentials, filesystem.disabled"
  autoMode: "classifyAllShell, hard_deny"
  modelPicker: "ordered labeled model list"
  showThinkingSummaries: bool
  prUrlTemplate: string
  timeFormat/timeZone/maxProseWidth/keybindingFlavor/spellcheck/vimInsertModeRemaps/emojiCompletionEnabled: "UI prefs"
  managed: "allowedProviders, availableModels(+Match/enforce), deniedModels, modelPricing, managedMcpServers, requiredMin/MaxVersion"
env:
  CLAUDE_EFFORT: "effort level"
  CLAUDE_CODE_NO_FLICKER: "1=alt-screen"
  CLAUDE_CODE_SAFE_MODE: "1=disable all customizations (--safe-mode)"
  CLAUDE_CODE_RESTRICTED: "1=no command/code/WebFetch tools (--restricted)"
  CLAUDE_CODE_MAX_CONCURRENT_SUBAGENTS: "default 20"
  CLAUDE_CODE_MAX_SUBAGENTS_PER_SESSION: "default 200"
  CLAUDE_CODE_MAX_WEB_SEARCHES_PER_SESSION: "default 200"
  CLAUDE_CODE_WORKFLOW_MAX_CONCURRENT_AGENTS: "1-256"
  CLAUDE_CODE_SUBAGENT_MODEL(_FORCE): "subagent model"
  CLAUDE_CODE_MAX_MCP_DESCRIPTION_LENGTH: "default 2048"
  CLAUDE_CODE_MCP_STARTUP_WAIT_MS: "0=no wait"
  CLAUDE_CODE_DISABLE_WEB_FETCH: "1=off"
  CLAUDE_CODE_SESSION_ID: "in Bash env"
  ANTHROPIC_DEFAULT_MODEL: "start model (persists /model)"
  CLAUDE_CODE_USE_POWERSHELL_TOOL: "1=on"
  CLAUDE_STREAM_IDLE_TIMEOUT_MS: ms
  DISABLE_UPDATES: "1=block updates"
  OTEL_LOG_RAW_API_BODIES: "1=full bodies"
models: {default: claude-sonnet-5-5, opus: claude-opus-5-5, sonnet: claude-sonnet-5-5, haiku: claude-haiku-4-5-20251001}   # fast mode: Opus 5/4.8 only
