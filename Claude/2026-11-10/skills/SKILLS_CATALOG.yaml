# Claude Code Skills Catalog
# Source: anthropics/claude-code (public)
# Maintained: yeongam/Prompt-Guide (auto-updated daily 00:00 UTC)
version: 2.1.322
updated: 2026-11-10

# ─── SKILLS ────────────────────────────────────────────────────────────────────
# Format: cmd | trigger | desc
skills:
  init:
    cmd: /init
    trigger: user asks to initialize or document codebase
    desc: Generate CLAUDE.md with codebase architecture, conventions, commands

  review:
    cmd: /review
    trigger: user asks to review PR or branch
    desc: Multi-pass PR review; checks logic, style, security, tests

  security-review:
    cmd: /security-review
    trigger: user asks security audit of current branch changes
    desc: OWASP-focused audit of pending diffs; outputs risk-ranked findings

  simplify:
    cmd: /simplify
    trigger: user asks to clean up or refactor changed code
    desc: Review changed code for reuse/quality/efficiency, then fix issues

  session-start-hook:
    cmd: /session-start-hook
    trigger: user wants test/lint runners on session start (web Claude Code)
    desc: Create SessionStart hook ensuring project can run tests and linters

  update-config:
    cmd: /update-config
    trigger: automated behavior requests ("when X", "allow Y", "set Z=val")
    desc: Configure settings.json; handles hooks, permissions, env vars

  keybindings-help:
    cmd: /keybindings-help
    trigger: user wants to remap keys or add chord shortcuts
    desc: Customize ~/.claude/keybindings.json; supports chord bindings

  fewer-permission-prompts:
    cmd: /fewer-permission-prompts
    trigger: user wants fewer permission dialogs
    desc: Scan transcripts → add bash/MCP allowlist to .claude/settings.json

  loop:
    cmd: /loop [interval] [/command]
    trigger: user wants recurring task (e.g. "check every 5m", "keep running X")
    desc: Run prompt or slash command on recurring interval (default 10m)
    example: "/loop 5m /review"

  claude-api:
    cmd: /claude-api
    trigger: code imports anthropic SDK; user asks about Claude API features
    desc: Build/debug Claude API apps; prompt caching, tool use, model migration
    sub: [latency-optimize, api-version, cost-optimize, upgrade, prompt-audit, managed-agents-secure, managed-agents-onboard]

  ultrareview:
    cmd: /ultrareview [PR#]
    trigger: user says "ultrareview" or wants multi-agent review
    desc: Parallel multi-agent cloud code review; no-arg=local branch, arg=GitHub PR
    note: Billed; requires git repo; no GitHub remote needed for local mode

  ultraplan:
    cmd: /ultraplan
    trigger: user wants cloud environment for complex planning
    desc: Auto-create cloud worktrees/environments for multi-agent planning tasks

  team-onboarding:
    cmd: /team-onboarding
    trigger: user wants teammate ramp-up guide
    desc: Generate onboarding guide from local Claude Code usage history/data

  effort:
    cmd: /effort
    trigger: user wants to adjust effort/quality level
    desc: "Interactive slider for session effort level (also: CLAUDE_EFFORT env var)"

  powerup:
    cmd: /powerup
    trigger: user wants feature demos or to learn Claude Code features
    desc: Interactive animated feature demos with lessons

  tui:
    cmd: /tui
    trigger: rendering looks flickery or user wants full-screen mode
    desc: "Switch to flicker-free alt-screen TUI rendering (also: CLAUDE_CODE_NO_FLICKER)"

  focus:
    cmd: /focus
    trigger: user wants compact view of conversation
    desc: "Toggle focus view showing only: prompt + tool summary + final response"

  undo:
    cmd: /undo
    desc: Alias for /rewind (can resume from before /clear)

  usage:
    cmd: /usage
    trigger: user asks about token or cost statistics
    desc: Show token usage and cost stats (merged /cost + /stats)

  theme:
    cmd: /theme [name]
    trigger: user wants to change or create visual theme
    desc: Create or switch custom color themes

  color:
    cmd: /color
    trigger: user wants a session color
    desc: Set random session color (no args = random pick)

  dataviz:
    cmd: /dataviz
    trigger: chart/dashboard/visualization request
    desc: Chart design guidance + palette validator

  goal:
    cmd: /goal <condition>
    trigger: user wants autonomous work until condition met
    desc: Keep working across turns until done (interactive, -p, RC)

  skill-doctor:
    cmd: /skill-doctor
    trigger: prune unused skills / context cost
    desc: Show unused loaded skills + context cost

  reload-skills:
    cmd: /reload-skills
    desc: Rescan skill dirs; sends only new/changed skills

  doctor-prompt-audit:
    cmd: /doctor prompt-audit
    desc: Audit CLAUDE.md/skills/agents for old-model prompt patterns

  auto-mode-setup:
    cmd: /auto-mode-setup
    desc: Guided auto-mode setup from project + recent sessions

  cd:
    cmd: /cd <dir>
    desc: Move session cwd; settings/hooks/skills reload, cache kept

  config:
    cmd: /config key=value
    desc: Set any setting from prompt (--help lists keys)

  output-style:
    cmd: /output-style [name]
    desc: List/switch output styles

  other:
    cmds: [/advisor, /scroll-speed, /plugin list|install --marketplace, /mcp reconnect all, /rate-limit-options, /usage-credits, /reload-plugins]

# ─── HOOKS ─────────────────────────────────────────────────────────────────────
# Hooks execute shell commands or MCP tools on lifecycle events.
# Block: exit 2 OR return JSON {decision:"block", reason:"..."}
# Retry: return JSON {retry:true} (PermissionDenied only)
# Conditional: add `if` field using permission rule syntax
hooks:
  PreToolUse:
    fires: Before any tool execution
    can_block: true
    use: Validate/log before bash/file ops; inject context

  PostToolUse:
    fires: After tool completes
    can_block: false
    use: Log results, trigger follow-up actions

  Notification:
    fires: On push-notification events
    can_block: false
    use: Forward alerts to mobile/Slack (requires Remote Control setup)

  Stop:
    fires: After assistant turn completes
    can_block: false
    use: Post-turn logging, notifications

  SubagentStop:
    fires: After subagent turn completes
    can_block: false
    use: Subagent result aggregation

  PreCompact:
    fires: Before conversation compaction
    can_block: true
    block_method: "exit 2 OR {decision:'block'}"
    use: Prevent compaction during critical operations

  TaskCreated:
    fires: When task created via TaskCreate tool
    can_block: false
    use: Log/track task creation events

  WorktreeCreate:
    fires: On worktree creation
    can_block: false
    type_http: returns hookSpecificOutput.worktreePath
    use: Custom worktree provisioning via HTTP endpoint

  PermissionDenied:
    fires: After auto-mode classifier denial
    can_block: false
    retry: "return {retry:true} to re-run classifier"
    use: Custom permission escalation flows

  onFailure:
    block: command/HTTP hook that fails/times out blocks action (added v2.1.2xx)

  hook_invoke_types:
    - type: shell          # shell command (default)
    - type: mcp_tool       # invoke MCP tool directly (added v2.1.118)
    - type: http           # HTTP endpoint (WorktreeCreate)

# ─── SETTINGS ──────────────────────────────────────────────────────────────────
# Place in .claude/settings.json (project) or ~/.claude/settings.json (user)
settings:
  skillOverrides:
    type: "off | user-invocable-only | name-only"
    desc: "off=hidden from model+slash, user-invocable-only=hidden from model, name-only=minimal exposure"

  autoScrollEnabled:
    type: bool
    desc: Disable auto-scroll in fullscreen TUI mode

  showThinkingSummaries:
    type: bool
    default: false
    desc: Control thinking summary generation in responses

  disableSkillShellExecution:
    type: bool
    desc: Disable inline shell execution within skill definitions

  prUrlTemplate:
    type: string
    desc: Custom URL template for PR footer badge (e.g. custom code-review tools)

  sandbox.network.deniedDomains:
    type: "list[string]"
    desc: Block specific domains even when broader allowlists exist

  permissions.denyInsteadOfPrompting: {type: bool, desc: deny calls that would prompt}
  maxEffortLevel: {type: string, desc: cap effort on all providers}
  modelPicker: {type: list, desc: curate /model picker}
  deniedModels: {type: list, desc: managed; block models}
  disableBundledSkills: {type: bool, desc: hide bundled skills/commands from model}
  syncClaudeAiSkills: {type: bool, desc: sync claude.ai skills; also syncClaudeAiPlugins}
  sandbox.network.strictAllowlist: {type: bool, desc: deny non-allowlisted hosts silently}
  sandbox.filesystem.disabled: {type: bool, desc: skip fs isolation, keep network control}
  crossSessionInbound: {type: string, desc: accept/hold/refuse cross-session msgs; also dialogExpiry}

# ─── ENV VARS ──────────────────────────────────────────────────────────────────
env:
  CLAUDE_EFFORT: "Current effort level; usable in skill template strings as ${CLAUDE_EFFORT}"
  CLAUDE_CODE_NO_FLICKER: "1 = enable alt-screen flicker-free rendering (same as /tui)"
  CLAUDE_CODE_USE_POWERSHELL_TOOL: "1 = enable PowerShell tool (Windows opt-in preview)"
  CLAUDE_STREAM_IDLE_TIMEOUT_MS: "Integer ms for streaming idle watchdog timeout"
  OTEL_LOG_RAW_API_BODIES: "1 = emit full API request/response bodies as OTEL events"
  DISABLE_UPDATES: "1 = block all update paths including manual 'claude update'"
  CLAUDE_CODE_SAFE_MODE: "1 = start w/o customizations (--safe-mode)"
  CLAUDE_CODE_DISABLE_BUNDLED_SKILLS: "1 = hide bundled skills"
  CLAUDE_CODE_SUBAGENT_MODEL_FORCE: "1 = force subagent model"
  CLAUDE_CODE_WORKFLOW_SUBAGENT_MODEL: "model for all workflow agents"
  CLAUDE_CODE_DISABLE_FILE_MENTIONS: "1 = @ mentions give paths only"
  CLAUDE_CODE_ENABLE_GATEWAY_MODEL_DISCOVERY: "1 = opt-in gateway /v1/models discovery"

# ─── MODELS ────────────────────────────────────────────────────────────────────
models:
  fable: claude-fable-5-2
  opus: claude-opus-5-5
  sonnet: claude-sonnet-5-5   # default
  haiku: claude-haiku-5-5

# Token notes: single source of truth; one-line descs; YAML compact.
